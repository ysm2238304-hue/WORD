<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>環保小尖兵-平板九宮格闖關</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 橫向模式鎖定提示 (如果螢幕是直的，提示轉向) */
        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
            #app { display: none; }
        }
        @media screen and (orientation: landscape) {
            .portrait-warning { display: none; }
            #app { display: block; }
        }

        /* 擴充動畫特效 */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(5%); } }
        
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-zoom-in { animation: zoom-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-slide-up { animation: slide-up 0.5s ease-out forwards; }
        .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; }
        
        /* 隱藏捲軸，呈現App感 */
        body { overflow: hidden; touch-action: none; }
        
        /* 九宮格按鈕立體感 */
        .grid-btn {
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .grid-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }
        .grid-btn.disabled {
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transform: translateY(4px);
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-blue-50 font-sans text-gray-800 h-screen w-screen overflow-hidden">

    <!-- 直式螢幕警告 -->
    <div class="portrait-warning fixed inset-0 z-50 bg-blue-600 text-white flex-col items-center justify-center p-8 text-center">
        <i data-lucide="rotate-ccw" class="w-24 h-24 mb-6 animate-spin-slow"></i>
        <h1 class="text-3xl font-black mb-4">請將平板轉為橫向使用</h1>
        <p class="text-xl">此遊戲專為橫向螢幕(Landscape)設計，以獲得最佳體驗！</p>
    </div>

    <!-- 背景裝飾 -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[60%] bg-cyan-200/40 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[70%] bg-green-200/40 rounded-full blur-3xl"></div>
        <div class="absolute top-[20%] left-[20%] w-32 h-12 bg-white/60 rounded-full blur-sm animate-[pulse_5s_ease-in-out_infinite]"></div>
        <div class="absolute top-[60%] right-[15%] w-48 h-16 bg-white/60 rounded-full blur-sm animate-[pulse_7s_ease-in-out_infinite]"></div>
    </div>

    <!-- 遊戲主要容器 -->
    <div id="app" class="relative z-10 h-full w-full max-w-7xl mx-auto flex items-center justify-center p-4 lg:p-8"></div>

    <script>
        // --- 遊戲題庫與劇情設定 ---
        const questions = [
            {
                villain: '菸蒂怪',
                villainIcon: '<i data-lucide="wind" class="w-20 h-20 text-gray-600"></i>',
                scenario: "😱 哎呀！一隻【菸蒂怪】正準備把菸蒂丟進水溝裡！",
                question: "請問亂丟菸蒂到水溝，最後會順著水流流到哪裡，污染生態？",
                options: ["(A) 美麗的大海裡", "(B) 遙遠的外太空"],
                correctAnswer: 0,
                explanation: "水溝不是煙灰缸，菸蒂會順著管線流進大海，毒害海洋生物喔！"
            },
            {
                villain: '塑膠濾嘴怪',
                villainIcon: '<i data-lucide="skull" class="w-20 h-20 text-amber-700"></i>',
                scenario: "🤔 【塑膠濾嘴怪】笑著說：「我是紙做的，很快就融化啦！」",
                question: "其實菸蒂濾嘴是塑膠做的！它在大自然中大約需要多久才能分解？",
                options: ["(A) 只要 1 個禮拜", "(B) 超過 10 年以上"],
                correctAnswer: 1,
                explanation: "菸蒂含有毒物質與塑膠微粒，極難分解，千萬別被騙了！"
            },
            {
                villain: '迷路阿伯',
                villainIcon: '<div class="relative flex flex-col items-center"><div class="w-12 h-12 rounded-full bg-blue-600"></div><div class="w-16 h-14 rounded-t-xl bg-blue-600 mt-1"></div></div>',
                scenario: "👴 遇到家裡的長輩抽完菸，不知道要把菸蒂丟哪...",
                question: "我們應該提醒他把菸蒂丟在哪裡才是對的？",
                options: ["(A) 彈到馬路上", "(B) 確實熄滅丟進垃圾桶"],
                correctAnswer: 1,
                explanation: "絕對不能彈到水溝或馬路上，一定要丟進專用的熄煙盒或垃圾桶！"
            },
            {
                villain: '火星怪',
                villainIcon: '<i data-lucide="flame" class="w-20 h-20 text-red-500 animate-pulse"></i>',
                scenario: "🔥 【火星怪】偷偷把還沒熄滅的菸蒂丟進了草叢！",
                question: "亂丟「還沒完全熄滅」的菸蒂，最容易引發可怕的火災！是真的嗎？",
                options: ["⭕ 是的，非常危險！", "❌ 假的，沒關係啦！"],
                correctAnswer: 0,
                explanation: "星星之火可以燎原！菸蒂一定要確實熄滅再丟棄喔！"
            },
            {
                villain: '臭臭怪',
                villainIcon: '<i data-lucide="droplets" class="w-20 h-20 text-lime-600"></i>',
                scenario: "🤢 來到公廁，【臭臭怪】希望大家上完廁所都不要沖水...",
                question: "為了讓下一個使用者有乾淨的廁所，離開前一定要隨手沖水。對不對？",
                options: ["⭕ 對！這是有禮貌的表現", "❌ 不對！給別人沖就好"],
                correctAnswer: 0,
                explanation: "隨手沖水，保持公廁不發臭，你我都開心！"
            },
            {
                villain: '阻塞怪',
                villainIcon: '<i data-lucide="ban" class="w-20 h-20 text-purple-600"></i>',
                scenario: "🚽 【阻塞怪】拿著衛生棉和濕紙巾，想通通丟進馬桶裡！",
                question: "雖然現在提倡衛生紙丟馬桶，那「衛生棉」或「濕紙巾」可以丟進馬桶嗎？",
                options: ["(A) 不可以！會塞住", "(B) 可以！沖下去就好"],
                correctAnswer: 0,
                explanation: "衛生棉和濕紙巾無法在水中溶解，會讓馬桶嚴重阻塞，一定要丟垃圾桶！"
            },
            {
                villain: '危險怪',
                villainIcon: '<i data-lucide="alert-triangle" class="w-20 h-20 text-orange-500"></i>',
                scenario: "🤸 【危險怪】示範了一個超危險的動作：踩在坐式馬桶上！",
                question: "在公廁看到「坐式馬桶」時，我們應該怎麼上廁所才安全？",
                options: ["(A) 乖乖坐著上", "(B) 踩上去蹲著上"],
                correctAnswer: 0,
                explanation: "蹲在坐式馬桶上非常危險，陶瓷破裂會受重傷，也會把馬桶蓋弄髒喔！"
            },
            {
                villain: '滑倒怪',
                villainIcon: '<i data-lucide="droplets" class="w-20 h-20 text-cyan-500"></i>',
                scenario: "💦 【滑倒怪】洗完手後，故意把水狂甩在地上！",
                question: "洗完手如果手濕濕的到處亂甩，容易害別人滑倒受傷。是真的嗎？",
                options: ["⭕ 是真的！很危險", "❌ 假的！水很快就乾了"],
                correctAnswer: 0,
                explanation: "洗完手請在洗手台上方把手甩乾，或用手帕擦乾，保持地面乾燥！"
            },
            {
                villain: '髒亂怪',
                villainIcon: '<i data-lucide="trash-2" class="w-20 h-20 text-gray-700"></i>',
                scenario: "🏫 巡視美麗的校園時，發現地上有別人亂丟的垃圾！",
                question: "身為環保小尖兵的你，這時候應該怎麼做？",
                options: ["(A) 裝作沒看到走掉", "(B) 撿起來丟進垃圾桶"],
                correctAnswer: 1,
                explanation: "維護校園環境，從你我做起！你就是最棒的環保小尖兵！"
            }
        ];

        // --- 遊戲狀態管理 ---
        let gameState = 'start'; // start, grid, playing, result
        let currentQ = 0;
        let score = 0;
        let answeredStatus = new Array(9).fill(null); // null: 未答, true: 答對, false: 答錯
        let feedback = null;

        const appDiv = document.getElementById('app');

        // 定義糖果配色給九宮格使用
        const gridColors = [
            'bg-red-400 text-red-900', 'bg-orange-400 text-orange-900', 'bg-amber-400 text-amber-900',
            'bg-green-400 text-green-900', 'bg-emerald-400 text-emerald-900', 'bg-teal-400 text-teal-900',
            'bg-cyan-400 text-cyan-900', 'bg-blue-400 text-blue-900', 'bg-indigo-400 text-indigo-900'
        ];

        // --- 核心渲染函數 ---
        function render() {
            if (gameState === 'start') appDiv.innerHTML = renderStart();
            else if (gameState === 'grid') appDiv.innerHTML = renderGrid();
            else if (gameState === 'playing') appDiv.innerHTML = renderPlaying();
            else if (gameState === 'result') appDiv.innerHTML = renderResult();
            
            lucide.createIcons();
        }

        // --- 遊戲邏輯函數 ---
        window.handleStart = function() {
            gameState = 'grid';
            answeredStatus = new Array(9).fill(null);
            score = 0;
            render();
        }

        window.selectQuestion = function(idx) {
            if (answeredStatus[idx] !== null) return; // 已答過不可選
            currentQ = idx;
            gameState = 'playing';
            feedback = null;
            render();
        }

        window.handleAnswer = function(idx) {
            if (feedback !== null) return; 
            
            const isCorrect = idx === questions[currentQ].correctAnswer;
            if (isCorrect) score += 1;
            
            // 記錄這題的狀態
            answeredStatus[currentQ] = isCorrect;

            feedback = {
                isCorrect: isCorrect,
                text: questions[currentQ].explanation
            };
            render();
        }

        window.handleNext = function() {
            // 檢查是否全部答完
            let completedCount = answeredStatus.filter(s => s !== null).length;
            
            if (completedCount === 9) {
                gameState = 'result';
            } else {
                gameState = 'grid'; // 回到九宮格選題
            }
            render();
        }

        // --- 畫面組件生成 ---

        // 1. 首頁 (橫向優化)
        function renderStart() {
            return `
            <div class="w-full max-w-5xl bg-white/90 backdrop-blur-md rounded-[2.5rem] shadow-2xl border-8 border-white p-8 md:p-12 flex flex-col md:flex-row items-center gap-8 animate-zoom-in">
                
                <!-- 左側：視覺插圖 -->
                <div class="flex-1 flex flex-col items-center justify-center animate-bounce-slow">
                    <div class="w-48 h-48 md:w-64 md:h-64 bg-gradient-to-tr from-green-300 to-green-500 rounded-full flex items-center justify-center shadow-xl border-8 border-white relative">
                        <i data-lucide="leaf" class="w-24 h-24 md:w-32 md:h-32 text-white"></i>
                        <i data-lucide="sparkles" class="w-12 h-12 text-yellow-300 absolute top-4 right-4 animate-pulse"></i>
                    </div>
                </div>
                
                <!-- 右側：標題與按鈕 -->
                <div class="flex-1 text-center md:text-left">
                    <div class="inline-block bg-green-100 text-green-700 font-black px-4 py-2 rounded-full mb-4 tracking-widest text-sm md:text-base border-2 border-green-200">
                        南投縣政府環境保護局
                    </div>
                    <h1 class="text-4xl md:text-6xl font-black text-blue-800 mb-4 leading-tight drop-shadow-sm">
                        環保小尖兵<br/>
                        <span class="text-orange-500 text-3xl md:text-5xl">沙包挑戰賽！</span>
                    </h1>
                    <p class="text-gray-600 font-bold mb-8 text-lg md:text-xl bg-blue-50/50 p-4 rounded-2xl border-l-4 border-blue-400">
                        歡迎來到敦和國小！快拿起手上的沙包，丟向九宮格選擇題目，一起打敗污染怪獸吧！
                    </p>

                    <button onclick="handleStart()" class="grid-btn w-full md:w-auto bg-gradient-to-b from-green-400 to-green-600 text-white font-black text-2xl md:text-3xl py-4 px-12 rounded-full flex items-center justify-center md:justify-start gap-3 cursor-pointer">
                        <i data-lucide="play-circle" class="w-8 h-8"></i>
                        開始丟沙包！
                    </button>
                </div>
            </div>
            `;
        }

        // 2. 九宮格選單 (橫向優化)
        function renderGrid() {
            let gridHtml = answeredStatus.map((status, i) => {
                let isDone = status !== null;
                let btnColor = isDone ? 'bg-gray-200 text-gray-400 disabled' : gridColors[i];
                let contentHtml = `<span class="text-5xl md:text-7xl font-black drop-shadow-md">${i + 1}</span>`;
                
                // 如果答過了，顯示過關印章
                if (isDone) {
                    if (status === true) {
                        contentHtml = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="check-circle" class="w-20 h-20 text-green-500 opacity-80 rotate-12"></i></div>`;
                    } else {
                        contentHtml = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="x-circle" class="w-20 h-20 text-red-400 opacity-80 -rotate-12"></i></div>`;
                    }
                }

                return `
                <button 
                    onclick="selectQuestion(${i})" 
                    class="grid-btn relative aspect-square rounded-3xl flex items-center justify-center border-4 border-white/50 overflow-hidden group ${btnColor}"
                >
                    ${isDone ? '' : '<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>'}
                    ${contentHtml}
                </button>
                `;
            }).join('');

            return `
            <div class="w-full max-w-6xl h-[85vh] flex flex-col md:flex-row gap-8 animate-fade-in">
                
                <!-- 左側狀態與提示 -->
                <div class="md:w-1/3 flex flex-col justify-center bg-white/80 backdrop-blur-sm p-8 rounded-[2rem] shadow-xl border-4 border-white">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center border-4 border-green-400">
                            <i data-lucide="leaf" class="w-10 h-10 text-green-500"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-black text-gray-800">請選題！</h2>
                            <p class="text-green-600 font-bold">目前得分：<span class="text-3xl text-orange-500 ml-1">${score * 100}</span></p>
                        </div>
                    </div>

                    <div class="bg-blue-50 p-6 rounded-2xl border-2 border-dashed border-blue-300 flex-1 flex flex-col justify-center">
                        <i data-lucide="target" class="w-12 h-12 text-blue-400 mb-4 mx-auto animate-bounce"></i>
                        <p class="text-lg font-bold text-center text-gray-700 leading-relaxed">
                            沙包丟中幾號呢？<br/>
                            <span class="text-blue-600 text-xl font-black">點擊右邊的號碼方塊</span><br/>
                            挑戰隱藏在裡面的怪獸！
                        </p>
                    </div>
                </div>

                <!-- 右側大型九宮格 -->
                <div class="md:w-2/3 bg-white/60 backdrop-blur-sm p-4 md:p-8 rounded-[2.5rem] shadow-2xl border-4 border-white flex items-center justify-center">
                    <div class="w-full max-w-[600px] grid grid-cols-3 gap-3 md:gap-6">
                        ${gridHtml}
                    </div>
                </div>
            </div>
            `;
        }

        // 3. 遊戲答題中 (左右分版橫向設計)
        function renderPlaying() {
            const q = questions[currentQ];
            
            let optionsHtml = q.options.map((opt, idx) => {
                let btnStateClass = feedback === null 
                    ? 'bg-white border-gray-300 text-gray-700 hover:bg-blue-50 hover:border-blue-400 hover:-translate-y-1 grid-btn cursor-pointer' 
                    : (idx === q.correctAnswer 
                        ? 'bg-green-100 border-green-500 text-green-800 shadow-inner' 
                        : 'bg-gray-100 border-gray-200 text-gray-400');
                
                return `
                <button ${feedback !== null ? 'disabled' : ''} onclick="handleAnswer(${idx})" class="w-full text-left p-5 md:p-6 rounded-[1.5rem] font-bold text-xl md:text-2xl transition-all duration-200 border-4 relative ${btnStateClass}">
                    ${opt}
                </button>
                `;
            }).join('');

            let feedbackHtml = '';
            if (feedback) {
                feedbackHtml = `
                <div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/60 backdrop-blur-sm rounded-[2.5rem] animate-fade-in">
                    <div class="bg-white w-full max-w-lg rounded-[2rem] p-8 shadow-2xl flex flex-col items-center text-center transform animate-zoom-in border-8 ${feedback.isCorrect ? 'border-green-400' : 'border-orange-400'}">
                        ${feedback.isCorrect ? `
                            <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-6 border-4 border-green-400 animate-bounce">
                                <i data-lucide="check-circle" class="w-14 h-14 text-green-500"></i>
                            </div>
                            <h3 class="text-4xl font-black text-green-600 mb-4 drop-shadow-sm">攻擊成功！</h3>
                        ` : `
                            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mb-6 border-4 border-red-400">
                                <i data-lucide="x-circle" class="w-14 h-14 text-red-500"></i>
                            </div>
                            <h3 class="text-4xl font-black text-red-600 mb-4 drop-shadow-sm">哎呀！打歪了</h3>
                        `}
                        <p class="text-gray-700 font-bold text-xl mb-8 leading-relaxed bg-gray-50 p-4 rounded-xl w-full">${feedback.text}</p>
                        
                        <button onclick="handleNext()" class="grid-btn w-full py-5 rounded-2xl font-black text-2xl text-white shadow-lg flex items-center justify-center gap-3 ${feedback.isCorrect ? 'bg-green-500 hover:bg-green-600' : 'bg-orange-500 hover:bg-orange-600'} cursor-pointer">
                            返回九宮格
                            <i data-lucide="arrow-right-circle" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>
                `;
            }

            let villainClass = feedback ? (feedback.isCorrect ? 'scale-75 rotate-12 opacity-40 grayscale blur-sm' : 'scale-110 -rotate-12') : 'animate-bounce-slow';

            return `
            <div class="w-full max-w-6xl h-[85vh] bg-white/90 backdrop-blur-md rounded-[2.5rem] shadow-2xl border-8 border-white p-6 md:p-10 flex flex-col md:flex-row gap-8 animate-slide-up relative">
                
                <!-- 左側：怪獸與情境 (佔 40%) -->
                <div class="md:w-2/5 bg-gradient-to-b from-gray-100 to-gray-200 rounded-[2rem] p-6 flex flex-col items-center justify-center border-4 border-gray-300 relative overflow-hidden shadow-inner">
                    <div class="absolute top-4 left-4 bg-blue-600 text-white font-black px-4 py-2 rounded-xl text-lg shadow-md border-2 border-blue-400 z-10">
                        第 ${currentQ + 1} 號沙包
                    </div>
                    
                    <div class="w-40 h-40 bg-white rounded-[2rem] border-8 border-gray-300 flex items-center justify-center shadow-xl mb-6 transition-all duration-500 ${villainClass} relative z-10">
                        ${q.villainIcon}
                    </div>
                    
                    <div class="bg-white/80 p-4 rounded-2xl border-2 border-gray-300 text-center shadow-sm z-10">
                        <span class="text-sm font-bold text-gray-500 block mb-1">遇見對手：</span>
                        <span class="text-2xl font-black text-red-600">${q.villain}</span>
                    </div>
                </div>

                <!-- 右側：題目與選項 (佔 60%) -->
                <div class="md:w-3/5 flex flex-col relative z-10">
                    <div class="bg-amber-100 text-amber-800 font-bold p-4 rounded-2xl mb-6 border-l-8 border-amber-400 shadow-sm text-lg md:text-xl">
                        ${q.scenario}
                    </div>
                    
                    <h2 class="text-2xl md:text-4xl font-black text-gray-800 mb-8 leading-snug flex-1 drop-shadow-sm">
                        ${q.question}
                    </h2>

                    <div class="grid gap-5 mt-auto pb-2">
                        ${optionsHtml}
                    </div>
                </div>

                ${feedbackHtml}
            </div>
            `;
        }

        // 4. 結算畫面 (橫向)
        function renderResult() {
            let title = score === 9 ? "完美通關神射手！" : (score >= 6 ? "優秀環保尖兵！" : "再接再厲小尖兵！");
            let message = score === 9 ? "太厲害了！你完全消滅了9隻污染怪獸，敦和國小變得超級乾淨！" : 
                         (score >= 6 ? "你擊退了大部分的怪獸，繼續保持環保好習慣，下次挑戰滿分喔！" : "怪獸還在搗蛋！重新拿好沙包，再挑戰一次把環保知識記起來吧！");
            let badgeColor = score === 9 ? "text-yellow-500" : (score >= 6 ? "text-blue-500" : "text-gray-400");

            return `
            <div class="w-full max-w-5xl bg-white/90 backdrop-blur-md rounded-[2.5rem] shadow-2xl border-8 border-white p-8 md:p-12 flex flex-col items-center animate-zoom-in relative overflow-hidden">
                <!-- 裝飾背景 -->
                <div class="absolute top-0 left-0 w-full h-40 bg-gradient-to-b from-blue-100 to-transparent -z-10"></div>
                
                <div class="flex justify-center mb-6 mt-4">
                    <div class="relative animate-bounce-slow">
                        <i data-lucide="award" class="w-32 h-32 ${badgeColor} drop-shadow-xl"></i>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <span class="text-white font-black text-3xl pt-2 drop-shadow-md">${score * 100}</span>
                        </div>
                    </div>
                </div>

                <div class="text-center w-full max-w-2xl mx-auto">
                    <h3 class="text-xl font-bold text-gray-500 mb-2">南投縣政府環境保護局 認證</h3>
                    <h2 class="text-4xl md:text-5xl font-black text-gray-800 mb-8 drop-shadow-sm">${title}</h2>
                    
                    <div class="bg-gray-50 p-8 rounded-3xl border-2 border-dashed border-gray-300 mb-8 shadow-inner">
                        <p class="text-2xl font-bold text-gray-700 leading-relaxed mb-6">
                            ${message}
                        </p>
                        <div class="flex justify-center items-center gap-12 pt-6 border-t-2 border-gray-200">
                            <div class="text-center">
                                <div class="text-gray-500 font-bold mb-2">最終得分</div>
                                <div class="text-4xl font-black text-orange-500">${score * 100} 分</div>
                            </div>
                            <div class="text-center">
                                <div class="text-gray-500 font-bold mb-2">擊敗怪獸</div>
                                <div class="text-4xl font-black text-green-600">${score} / 9 隻</div>
                            </div>
                        </div>
                    </div>

                    <button onclick="handleStart()" class="grid-btn w-full md:w-2/3 mx-auto bg-gradient-to-b from-blue-500 to-blue-700 text-white font-black text-2xl py-5 rounded-full flex items-center justify-center gap-3 cursor-pointer">
                        <i data-lucide="refresh-ccw" class="w-8 h-8"></i>
                        再來一局
                    </button>
                </div>
            </div>
            `;
        }

        // 啟動應用
        render();

    </script>
</body>
</html>
