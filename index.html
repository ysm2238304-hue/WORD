<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 加入 viewport-fit=cover 與 user-scalable=no 雙重鎖死縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- ==================================================
         Web App 全螢幕模式標籤 (支援「加到主畫面」功能)
         ================================================== -->
    <meta name="mobile-web-app-capable" content="yes"> <!-- 針對 Android Chrome -->
    <meta name="apple-mobile-web-app-capable" content="yes"> <!-- 針對 iOS Safari -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"> <!-- 隱藏/透明化系統狀態列 -->
    <meta name="apple-mobile-web-app-title" content="環保小尖兵"> <!-- 加入主畫面時的預設 App 名稱 -->
    <meta name="theme-color" content="#EFF6FF"> <!-- 設定系統狀態列底色，對應 Tailwind 的 blue-50 -->
    
    <title>環保小尖兵-平板九宮格闖關</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 橫向模式鎖定提示 */
        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
            #app { display: none; }
        }
        @media screen and (orientation: landscape) {
            .portrait-warning { display: none; }
            #app { display: block; }
        }

        /* 擴充動畫特效 */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(4dvh); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(5%); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-zoom-in { animation: zoom-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
        .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        /* 
           ==================================================
           終極防護：徹底封印網頁原生滑動、放大與選取行為
           ================================================== 
        */
        html, body {
            -webkit-text-size-adjust: 100%; /* 防 Safari 橫向重整自動放大字體 */
            text-size-adjust: 100%;
            -webkit-user-select: none; /* 防長按文字反白選取 */
            user-select: none;
            -webkit-touch-callout: none; /* 防長按跳出系統選單 */
            overflow: hidden; 
            overscroll-behavior: none; 
            touch-action: none; 
        }
        * { 
            touch-action: none; /* 全域封鎖手勢，防止 iOS 誤判 */
        }
        /* 釋放按鈕的點擊權限，但維持無延遲防護 */
        button, a, .grid-btn { 
            touch-action: manipulation; 
            outline: none !important;
            -webkit-tap-highlight-color: transparent; /* 消除點擊時的預設灰底 */
        }
        
        /* 九宮格與按鈕立體感 (改用相對單位適應縮放) */
        .grid-btn {
            box-shadow: 0 clamp(4px, 1dvh, 8px) 0 rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .grid-btn:active {
            transform: translateY(clamp(4px, 1dvh, 8px)) !important;
            box-shadow: 0 0 0 rgba(0,0,0,0.15) !important;
        }
        .grid-btn.disabled {
            box-shadow: 0 clamp(2px, 0.5dvh, 4px) 0 rgba(0,0,0,0.1);
            transform: translateY(clamp(2px, 0.5dvh, 4px));
            cursor: not-allowed;
        }

        /* ==================================================
           全新開發：標準台灣直列注音排版系統 (Flexbox 奈米切割實作)
           ================================================== */
        .z-word {
            display: inline-flex;
            align-items: center; 
            margin: 0 1px clamp(2px, 0.5dvh, 4px) 1px; 
            vertical-align: middle;
        }
        .z-base { line-height: 1; }
        .z-ruby {
            display: inline-flex;
            flex-direction: row;
            font-size: 0.45em; 
            font-weight: 800;
            color: #4B5563; 
            margin-left: 2px;
        }
        .z-symbols { display: flex; flex-direction: column; justify-content: center; }
        .z-sym { line-height: 1.05; text-align: center; }
        .z-sym.light-tone { margin-bottom: 2px; font-size: 1.2em; }
        .z-tone { display: flex; flex-direction: column; justify-content: center; margin-left: 1px; }
        .zhuyin-text {
            line-height: 1.8 !important; 
            word-break: break-all;     
        }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-blue-50 font-sans text-gray-800 h-[100dvh] w-[100dvw] overflow-hidden flex items-center justify-center">

    <!-- 載入保護幕：防止重整時大字體瞬間閃現導致 Safari 強制放大 -->
    <div id="loading-screen" class="fixed inset-0 z-[999] bg-blue-50 flex flex-col items-center justify-center transition-opacity duration-500">
        <i data-lucide="loader-2" class="w-[10dvh] h-[10dvh] text-blue-500 animate-spin mb-[2dvh]"></i>
        <h2 class="text-[clamp(1.5rem,3dvh,2.5rem)] font-black text-blue-800 tracking-widest">系統初始化中...</h2>
    </div>

    <!-- 直式螢幕警告 -->
    <div class="portrait-warning fixed inset-0 z-[900] bg-blue-600 text-white flex-col items-center justify-center p-[4dvh] text-center">

        <h1 class="text-[clamp(2rem,6dvh,4rem)] font-black mb-[2dvh]">請將平板轉為橫向使用</h1>
        <p class="text-[clamp(1.2rem,3dvh,2rem)]">此遊戲專為橫向螢幕設計，以獲得最佳體驗！</p>
    </div>

    <!-- 背景裝飾 -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[60%] bg-cyan-200/40 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[70%] bg-green-200/40 rounded-full blur-3xl"></div>
        <div class="absolute top-[20%] left-[20%] w-[10dvw] h-[5dvh] bg-white/60 rounded-full blur-sm animate-[pulse_5s_ease-in-out_infinite]"></div>
        <div class="absolute top-[60%] right-[15%] w-[15dvw] h-[8dvh] bg-white/60 rounded-full blur-sm animate-[pulse_7s_ease-in-out_infinite]"></div>
    </div>

    <!-- 遊戲主要滿版容器 (100dvh) -->
    <div id="app" class="relative z-10 w-full h-[100dvh] max-w-[1350px] mx-auto p-[2dvh] md:p-[3dvh] lg:p-[4dvh] flex items-center justify-center overflow-hidden"></div>

    <script>
        // --- 處理載入保護幕 (延遲 300ms 等排版完畢才顯示) ---
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 300);
        });

        // --- 徹底物理防護雙指縮放與滾動 ---
        document.addEventListener('touchmove', function(event) { event.preventDefault(); }, { passive: false });
        document.addEventListener('touchstart', function(event) { if (event.touches.length > 1) { event.preventDefault(); } }, { passive: false });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { event.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        // --- 實體化立體怪獸設計 (替換了危險怪為碎裂炸彈怪) ---

        // --- 全新注音版官方題庫 ---

            },
            {

            },
            {

                scenario: "💦 趕{ㄍㄢˇ}時{ㄕˊ}間{ㄐㄧㄢ}的{ㄉㄜ˙}【滑{ㄏㄨㄚˊ}倒{ㄉㄠˇ}怪{ㄍㄨㄞˋ}】，洗{ㄒㄧˇ}完{ㄨㄢˊ}手{ㄕㄡˇ}用{ㄩㄥˋ}力{ㄌㄧˋ}把{ㄅㄚˇ}水{ㄕㄨㄟˇ}狂{ㄎㄨㄤˊ}甩{ㄕㄨㄞˇ}在{ㄗㄞˋ}地{ㄉㄧˋ}板{ㄅㄢˇ}上{ㄕㄤˋ}！",
                question: "為{ㄨㄟˋ}了{ㄌㄜ˙}趕{ㄍㄢˇ}快{ㄎㄨㄞˋ}出{ㄔㄨ}去{ㄑㄩˋ}玩{ㄨㄢˊ}，上{ㄕㄤˋ}完{ㄨㄢˊ}廁{ㄘㄜˋ}所{ㄙㄨㄛˇ}洗{ㄒㄧˇ}完{ㄨㄢˊ}手{ㄕㄡˇ}只{ㄓˇ}要{ㄧㄠˋ}用{ㄩㄥˋ}力{ㄌㄧˋ}把{ㄅㄚˇ}水{ㄕㄨㄟˇ}甩{ㄕㄨㄞˇ}在{ㄗㄞˋ}地{ㄉㄧˋ}板{ㄅㄢˇ}上{ㄕㄤˋ}就{ㄐㄧㄡˋ}好{ㄏㄠˇ}，請{ㄑㄧㄥˇ}問{ㄨㄣˋ}這{ㄓㄜˋ}樣{ㄧㄤˋ}正{ㄓㄥˋ}確{ㄑㄩㄝˋ}嗎{ㄇㄚ˙}?",
                options: ["(A) 錯{ㄘㄨㄛˋ}誤{ㄨˋ}", "(B) 正{ㄓㄥˋ}確{ㄑㄩㄝˋ}"], correctAnswer: 0,
                explanation: "地{ㄉㄧˋ}板{ㄅㄢˇ}積{ㄐㄧ}水{ㄕㄨㄟˇ}很{ㄏㄣˇ}容{ㄖㄨㄥˊ}易{ㄧˋ}害{ㄏㄞˋ}別{ㄅㄧㄝˊ}人{ㄖㄣˊ}滑{ㄏㄨㄚˊ}倒{ㄉㄠˇ}受{ㄕㄡˋ}傷{ㄕㄤ}！洗{ㄒㄧˇ}完{ㄨㄢˊ}手{ㄕㄡˇ}請{ㄑㄧㄥˇ}在{ㄗㄞˋ}洗{ㄒㄧˇ}手{ㄕㄡˇ}台{ㄊㄞˊ}上{ㄕㄤˋ}方{ㄈㄤ}甩{ㄕㄨㄞˇ}乾{ㄍㄢ}，或{ㄏㄨㄛˋ}用{ㄩㄥˋ}擦{ㄘㄚ}手{ㄕㄡˇ}紙{ㄓˇ}擦{ㄘㄚ}乾{ㄍㄢ}喔{ㄛ}。"
            }
        ];

        let gameState = 'start'; 
        let currentQ = 0;
        let score = 0;
        let answeredStatus = new Array(9).fill(null); 
        let feedback = null;
        let showConfirmModal = false;

        const appDiv = document.getElementById('app');

        const gridColors = [
            'bg-red-400 text-red-900', 'bg-orange-400 text-orange-900', 'bg-amber-400 text-amber-900',
            'bg-green-400 text-green-900', 'bg-emerald-400 text-emerald-900', 'bg-teal-400 text-teal-900',
            'bg-cyan-400 text-cyan-900', 'bg-blue-400 text-blue-900', 'bg-indigo-400 text-indigo-900'
        ];

        // --- 全新注音解析工具 ---
        const parseZhuyin = (str) => {
            if (!str) return '';
            return str.replace(/(.)\{(.*?)\}/g, (match, baseChar, zhuyinStr) => {
                let tone = ''; let isLightTone = false; let symbols = zhuyinStr;
                if (symbols.includes('˙')) { isLightTone = true; symbols = symbols.replace('˙', ''); } 
                else if (symbols.includes('ˊ')) { tone = 'ˊ'; symbols = symbols.replace('ˊ', ''); } 
                else if (symbols.includes('ˇ')) { tone = 'ˇ'; symbols = symbols.replace('ˇ', ''); } 
                else if (symbols.includes('ˋ')) { tone = 'ˋ'; symbols = symbols.replace('ˋ', ''); }

                let symbolsHtml = '';
                if (isLightTone) symbolsHtml += '<span class="z-sym light-tone">˙</span>';
                for (let i = 0; i < symbols.length; i++) { symbolsHtml += `<span class="z-sym">${symbols[i]}</span>`; }
                return `<span class="z-word"><span class="z-base">${baseChar}</span><span class="z-ruby"><span class="z-symbols">${symbolsHtml}</span><span class="z-tone">${tone}</span></span></span>`;
            });
        };

        function render() {
            let content = '';
            if (gameState === 'start') content = renderStart();
            else if (gameState === 'grid') content = renderGrid();
            else if (gameState === 'playing') content = renderPlaying();
            else if (gameState === 'result') content = renderResult();

            let modalHtml = '';
            if (showConfirmModal) {
                modalHtml = `
                <div class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-[4dvh]">
                    <div class="bg-white p-[5dvh] rounded-[3dvh] shadow-2xl border-[clamp(6px,1dvh,12px)] border-red-300 max-w-lg w-full text-center transform animate-zoom-in">
                        <div class="w-[12dvh] h-[12dvh] bg-red-100 rounded-full flex items-center justify-center border-[clamp(4px,0.5dvh,8px)] border-red-400 mx-auto mb-[3dvh]">
                            <i data-lucide="alert-triangle" class="w-[6dvh] h-[6dvh] text-red-500 animate-pulse"></i>
                        </div>
                        <h3 class="text-[clamp(1.8rem,4dvh,2.5rem)] font-black text-gray-800 mb-[2dvh]">確定要重新開始？</h3>
                        <p class="text-gray-600 font-bold text-[clamp(1.2rem,2.5dvh,1.5rem)] mb-[4dvh] bg-gray-50 py-[2dvh] rounded-[2dvh] border-2 border-gray-200">目前的闖關紀錄將會全部消失喔！</p>
                        <div class="flex gap-[2dvw] justify-center">
                            <button onclick="confirmRestart(false)" class="grid-btn flex-1 bg-gray-200 text-gray-700 font-black text-[clamp(1.2rem,3dvh,1.8rem)] py-[2.5dvh] rounded-[2dvh] border-[clamp(2px,0.5dvh,4px)] border-gray-300 hover:bg-gray-300">取消</button>
                            <button onclick="confirmRestart(true)" class="grid-btn flex-1 bg-red-500 text-white font-black text-[clamp(1.2rem,3dvh,1.8rem)] py-[2.5dvh] rounded-[2dvh] border-[clamp(2px,0.5dvh,4px)] border-red-600 hover:bg-red-600">確定重置</button>
                        </div>
                    </div>
                </div>`;
            }
            appDiv.innerHTML = content + modalHtml;
            lucide.createIcons();
        }

        window.handleStart = function() { gameState = 'grid'; answeredStatus = new Array(9).fill(null); score = 0; render(); }
        window.promptRestart = function() { showConfirmModal = true; render(); }
        window.confirmRestart = function(yes) {
            showConfirmModal = false;
            if(yes) { gameState = 'start'; answeredStatus = new Array(9).fill(null); score = 0; currentQ = 0; feedback = null; }
            render();
        }
        window.selectQuestion = function(idx) {
            if (answeredStatus[idx] !== null) return; 
            currentQ = idx; gameState = 'playing'; feedback = null; render();
        }
        window.handleAnswer = function(idx) {
            if (feedback !== null) return; 
            const isCorrect = idx === questions[currentQ].correctAnswer;
            if (isCorrect) score += 1;
            answeredStatus[currentQ] = isCorrect;
            feedback = { isCorrect: isCorrect, text: questions[currentQ].explanation };
            render();
        }
        window.handleNext = function() {
            let completedCount = answeredStatus.filter(s => s !== null).length;
            if (completedCount === 9) gameState = 'result'; else gameState = 'grid';
            render();
        }

        // --- 1. 首頁 (單列標題 + 液態排版) ---

                            <p class="text-blue-700 font-black text-[clamp(1.5rem,3.5dvh,2rem)] drop-shadow-sm mt-[0.5dvh]">一起打敗污染怪獸吧!!!</p>

                        <i data-lucide="play-circle" class="w-[clamp(2rem,4.5dvh,3.5rem)] h-[clamp(2rem,4.5dvh,3.5rem)]"></i> 開始挑戰！
                    </button>
                </div>
            </div>
            `;
        }

        // --- 2. 九宮格選單 (完美綁定高寬比不溢出) ---
        function renderGrid() {
            let gridHtml = answeredStatus.map((status, i) => {
                let isDone = status !== null;
                let btnColor = isDone ? 'bg-gray-200 text-gray-400 disabled' : gridColors[i];
                let contentHtml = `<span class="text-[clamp(3rem,8dvh,6rem)] font-black drop-shadow-lg">${i + 1}</span>`;
                if (isDone) {
                    if (status === true) contentHtml = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="check-circle" class="w-[45%] h-[45%] text-green-500 opacity-80 rotate-12"></i></div>`;
                    else contentHtml = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="x-circle" class="w-[45%] h-[45%] text-red-400 opacity-80 -rotate-12"></i></div>`;
                }
                return `
                <button onclick="selectQuestion(${i})" class="grid-btn relative w-full h-full rounded-[clamp(1rem,3dvh,2rem)] flex items-center justify-center border-[clamp(3px,0.5dvh,6px)] border-white/60 overflow-hidden group ${btnColor}">

            return `
            <div class="w-full h-full flex flex-row gap-[3dvw] animate-fade-in">
                
                <!-- 左側狀態 -->
                <div class="w-[35%] h-full flex flex-col justify-between bg-white/90 backdrop-blur-md p-[clamp(1rem,3.5dvh,2.5rem)] rounded-[clamp(1.5rem,4dvh,3rem)] shadow-2xl border-[clamp(6px,1dvh,12px)] border-white relative">
                    <div class="flex flex-col items-center justify-center gap-[1.5dvh] bg-gradient-to-b from-green-50 to-blue-50 px-[2dvw] py-[2dvh] rounded-[clamp(1rem,3dvh,2rem)] border-[clamp(2px,0.5dvh,4px)] border-white shadow-md flex-shrink-0 w-full mx-auto">

                        <p class="text-green-600 font-bold text-[clamp(1.2rem,3dvh,1.5rem)]">目前得分：<span class="text-[clamp(2rem,5dvh,3rem)] text-orange-500 ml-2 drop-shadow-sm">${score * 100}</span></p>
                    </div>

                    <div class="flex flex-col gap-[2dvh] flex-shrink-0">
                        <div class="bg-blue-50/80 p-[2dvh] rounded-[clamp(1rem,3dvh,2rem)] border-[clamp(3px,0.5dvh,6px)] border-dashed border-blue-300 flex flex-col items-center justify-center">
                            <i data-lucide="target" class="w-[clamp(2rem,5dvh,3.5rem)] h-auto text-blue-500 mb-[1dvh] animate-bounce"></i>
                            <p class="text-[clamp(1rem,2.5dvh,1.5rem)] font-bold text-center text-gray-700 leading-snug">沙包丟中幾號呢？<br/><span class="text-blue-600 font-black">點擊右邊對應號碼</span></p>
                        </div>
                        <button onclick="promptRestart()" class="grid-btn w-full bg-white/90 backdrop-blur-sm text-red-500 rounded-[clamp(1rem,3dvh,2rem)] py-[2dvh] shadow-sm border-[clamp(3px,0.5dvh,6px)] border-red-200 hover:bg-red-50 transition-all flex items-center justify-center gap-[1dvw] font-black">
                            <i data-lucide="rotate-ccw" class="w-[clamp(1.2rem,3dvh,2rem)] h-auto"></i>
                            <span class="text-[clamp(1.2rem,3dvh,2rem)]">重新開始</span>
                        </button>
                    </div>
                </div>

                <!-- 右側九宮格 -->
                <div class="w-[65%] h-full bg-white/70 backdrop-blur-md p-[clamp(1.5rem,4dvh,3rem)] rounded-[clamp(1.5rem,4dvh,3rem)] shadow-2xl border-[clamp(6px,1dvh,12px)] border-white flex items-center justify-center">
                    <div class="h-full aspect-square grid grid-cols-3 gap-[2.5dvh]">
                        ${gridHtml}
                    </div>
                </div>
            </div>
            `;
        }

        // --- 3. 遊戲答題中 (智慧限縮字體與間距) ---
        function renderPlaying() {
            const q = questions[currentQ];
            let optionsHtml = q.options.map((opt, idx) => {
                let btnStateClass = feedback === null 
                    ? 'bg-white border-gray-300 text-gray-700 hover:bg-blue-50 hover:border-blue-400 grid-btn cursor-pointer' 
                    : (idx === q.correctAnswer ? 'bg-green-100 border-green-500 text-green-800 shadow-inner' : 'bg-gray-100 border-gray-200 text-gray-400');
                return `
                <button ${feedback !== null ? 'disabled' : ''} onclick="handleAnswer(${idx})" class="w-full text-left p-[clamp(0.8rem,2.2dvh,1.5rem)] rounded-[clamp(1rem,3dvh,2rem)] font-black text-[clamp(1rem,2.8dvh,1.5rem)] border-[clamp(3px,0.5dvh,6px)] relative flex justify-between items-center ${btnStateClass}">
                    <span class="zhuyin-text flex-1 pr-2">${parseZhuyin(opt)}</span>
                    ${feedback === null ? `<i data-lucide="mouse-pointer-click" class="w-[clamp(1.5rem,4dvh,2.5rem)] h-auto opacity-30 flex-shrink-0 ml-1"></i>` : ''}
                </button>
                `;
            }).join('');

            let feedbackHtml = '';
            if (feedback) {
                feedbackHtml = `
                <div class="absolute inset-0 z-50 flex items-center justify-center p-[4dvh] bg-gray-900/70 backdrop-blur-sm rounded-[clamp(1.5rem,4dvh,3rem)] animate-fade-in">
                    <div class="bg-white w-[80%] max-w-2xl h-[85dvh] rounded-[clamp(2rem,5dvh,3rem)] p-[clamp(1.5rem,4dvh,3rem)] shadow-2xl flex flex-col items-center justify-evenly text-center transform animate-zoom-in border-[clamp(6px,1dvh,12px)] ${feedback.isCorrect ? 'border-green-400' : 'border-orange-400'}">
                        ${feedback.isCorrect ? `
                            <div class="w-[clamp(4rem,10dvh,6rem)] h-[clamp(4rem,10dvh,6rem)] bg-green-100 rounded-full flex flex-shrink-0 items-center justify-center border-[clamp(3px,0.5dvh,6px)] border-green-400 animate-bounce">
                                <i data-lucide="check-circle" class="w-[50%] h-[50%] text-green-500"></i>
                            </div>
                            <h3 class="text-[clamp(2rem,5dvh,3rem)] font-black text-green-600 flex-shrink-0">攻擊成功！</h3>
                        ` : `
                            <div class="w-[clamp(4rem,10dvh,6rem)] h-[clamp(4rem,10dvh,6rem)] bg-red-100 rounded-full flex flex-shrink-0 items-center justify-center border-[clamp(3px,0.5dvh,6px)] border-red-400">
                                <i data-lucide="x-circle" class="w-[50%] h-[50%] text-red-500"></i>
                            </div>
                            <h3 class="text-[clamp(2rem,5dvh,3rem)] font-black text-red-600 flex-shrink-0">哎呀！打歪了</h3>
                        `}
                        <div class="w-full bg-gray-50 p-[clamp(1rem,3dvh,2rem)] rounded-[clamp(1rem,3dvh,2rem)] border-[clamp(2px,0.5dvh,4px)] border-gray-200 text-left flex-shrink-0">
                            <p class="text-gray-700 font-bold text-[clamp(1.2rem,3dvh,1.8rem)] leading-relaxed zhuyin-text">${parseZhuyin(feedback.text)}</p>
                        </div>
                        <button onclick="handleNext()" class="grid-btn w-full py-[clamp(1.2rem,3dvh,2rem)] rounded-full font-black text-[clamp(1.5rem,3.5dvh,2rem)] text-white shadow-lg flex items-center justify-center gap-[1dvw] ${feedback.isCorrect ? 'bg-green-500' : 'bg-orange-500'} cursor-pointer flex-shrink-0">
                            返回九宮格 <i data-lucide="arrow-right-circle" class="w-[clamp(1.5rem,4dvh,2.5rem)] h-auto"></i>
                        </button>
                    </div>
                </div>
                `;
            }

            let villainClass = feedback ? (feedback.isCorrect ? 'scale-75 rotate-12 opacity-30 grayscale blur-md' : 'scale-110 -rotate-12 drop-shadow-2xl') : '';

            return `
            <div class="w-full h-full bg-white/95 backdrop-blur-xl rounded-[clamp(1.5rem,4dvh,3rem)] shadow-2xl border-[clamp(6px,1dvh,12px)] border-white p-[clamp(1rem,3dvh,2.5rem)] flex flex-row gap-[3dvw] animate-slide-up relative">
                <!-- 左側：怪獸展示區 -->
                <div class="w-[30%] h-full bg-gradient-to-b from-gray-100 to-gray-200 rounded-[clamp(1.5rem,4dvh,3rem)] p-[clamp(1rem,3dvh,2rem)] flex flex-col items-center justify-between border-[clamp(4px,0.8dvh,10px)] border-gray-300 relative shadow-inner">
                    <div class="absolute top-[2dvh] left-[2dvw] bg-blue-600 text-white font-black px-[1dvw] py-[1dvh] rounded-xl text-[clamp(0.8rem,2dvh,1.2rem)] shadow-md border-2 border-blue-400 z-20 flex items-center gap-[0.5dvw]">
                        <i data-lucide="hash" class="w-[clamp(1rem,2.5dvh,1.5rem)] h-auto"></i> 題 ${currentQ + 1}
                    </div>
                    
                    <div class="flex-1 w-full min-h-0 flex items-center justify-center relative">
                        <div class="absolute w-[85%] aspect-square bg-gray-300/40 rounded-full blur-xl transform translate-y-[10%]"></div>
                        <div class="w-full h-full flex items-center justify-center transition-all duration-700 ${villainClass} relative z-10">
                            ${q.villainIcon}
                        </div>
                    </div>
                    
                    <div class="bg-white/90 px-[1.5dvw] py-[1.5dvh] rounded-[clamp(1rem,3dvh,2rem)] border-[clamp(3px,0.5dvh,6px)] border-gray-300 text-center shadow-md z-20 w-full flex-shrink-0">
                        <span class="text-[clamp(0.8rem,2dvh,1.2rem)] font-bold text-gray-500 block mb-[0.5dvh]">遇到污染怪獸：</span>
                        <span class="text-[clamp(1.5rem,3.5dvh,2.5rem)] font-black text-red-600 drop-shadow-sm">${q.villain}</span>
                    </div>
                </div>

                <!-- 右側：問答區 (靠 Flex 智慧擠壓分配) -->
                <div class="w-[70%] h-full flex flex-col justify-between py-0">
                    <div class="flex-shrink-0 bg-amber-100 text-amber-900 font-black p-[clamp(1rem,2.5dvh,1.5rem)] rounded-[clamp(1rem,3dvh,2rem)] border-l-[clamp(4px,0.8dvh,8px)] border-amber-400 shadow-sm flex items-center gap-[1dvw]">
                        <i data-lucide="alert-circle" class="w-[clamp(1.5rem,4dvh,2.5rem)] h-auto text-amber-600 flex-shrink-0"></i>
                        <span class="leading-relaxed zhuyin-text w-full text-[clamp(1rem,2.5dvh,1.5rem)]">${parseZhuyin(q.scenario)}</span>
                    </div>
                    
                    <div class="flex-1 min-h-0 bg-blue-50 p-[clamp(1.5rem,3dvh,2.5rem)] rounded-[clamp(1.5rem,4dvh,3rem)] border-[clamp(3px,0.5dvh,6px)] border-blue-200 shadow-inner flex items-center justify-center text-center my-[2dvh]">
                        <h2 class="text-[clamp(1.2rem,3.5dvh,2.2rem)] font-black text-gray-800 leading-snug drop-shadow-sm zhuyin-text w-full">
                            ${parseZhuyin(q.question)}
                        </h2>
                    </div>
                    
                    <div class="flex-shrink-0 flex flex-col gap-[1.5dvh]">
                        ${optionsHtml}
                    </div>
                </div>
                ${feedbackHtml}
            </div>
            `;
        }

        // --- 4. 結算畫面 (液態排版分配) ---
        function renderResult() {
            let title = score === 9 ? "完美通關神射手！" : (score >= 6 ? "優秀環保尖兵！" : "再接再厲小尖兵！");
            let message = score === 9 ? "太厲害了！你消滅了所有的污染怪獸，成功守護了敦和國小！" : 
                         (score >= 6 ? "表現不錯喔！擊退了大部分的怪獸，繼續保持環保好習慣！" : "怪獸還在搗蛋！重新拿好沙包，再挑戰一次吧！");
            
            let badgeColor = score === 9 ? "text-yellow-500" : (score >= 6 ? "text-blue-500" : "text-gray-400");
            let badgeBg = score === 9 ? "bg-gradient-to-b from-yellow-50 to-orange-100 border-yellow-300" : 
                         (score >= 6 ? "bg-gradient-to-b from-blue-50 to-cyan-100 border-blue-300" : "bg-gradient-to-b from-gray-50 to-gray-200 border-gray-300");
            
            let starCount = score === 9 ? 3 : (score >= 6 ? 2 : 1);
            let starsHtml = '<div class="flex justify-center items-end gap-[1dvw] mb-[2dvh]">';
            for(let i=0; i<3; i++) {
                let isCenter = i === 1;
                let sizeClass = isCenter ? 'w-[clamp(4rem,10dvh,6rem)] h-auto mb-[2dvh]' : 'w-[clamp(3rem,8dvh,4.5rem)] h-auto';
                let colorClass = i < starCount ? 'text-yellow-400' : 'text-gray-300 opacity-50';
                let fillStyle = i < starCount ? 'fill: currentColor' : 'fill: none';
                starsHtml += `<i data-lucide="star" class="${sizeClass} ${colorClass} drop-shadow-md animate-bounce-slow" style="animation-delay: ${i*0.2}s; ${fillStyle}"></i>`;
            }
            starsHtml += '</div>';

            return `
            <div class="w-full h-full bg-white/95 backdrop-blur-xl rounded-[clamp(1.5rem,4dvh,3rem)] shadow-2xl border-[clamp(6px,1dvh,12px)] border-white p-[clamp(1.5rem,4dvh,3rem)] flex flex-row gap-[4dvw] animate-zoom-in relative">
                <div class="absolute top-[-20%] right-[-10%] w-[30dvh] h-[30dvh] bg-yellow-200/40 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute bottom-[-10%] left-[-10%] w-[25dvh] h-[25dvh] bg-blue-200/40 rounded-full blur-3xl pointer-events-none"></div>

                <!-- 左側：榮譽勳章與評價區 -->
                <div class="w-5/12 h-full rounded-[clamp(1.5rem,4dvh,3rem)] p-[clamp(1.5rem,4dvh,3rem)] flex flex-col items-center justify-evenly border-[clamp(6px,1dvh,12px)] ${badgeBg} relative shadow-inner">
                    <i data-lucide="sparkles" class="absolute top-[10%] left-[10%] w-[clamp(2rem,5dvh,3rem)] h-auto text-yellow-400 animate-pulse opacity-80"></i>
                    <i data-lucide="sparkles" class="absolute bottom-[15%] right-[10%] w-[clamp(2.5rem,6dvh,4rem)] h-auto text-yellow-500 animate-pulse opacity-80"></i>
                    ${starsHtml}
                    <div class="relative animate-float my-[1dvh]">
                        <i data-lucide="award" class="w-[clamp(150px,35dvh,250px)] h-auto ${badgeColor} drop-shadow-[0_15px_20px_rgba(0,0,0,0.15)]" style="fill: currentColor; opacity: 0.2"></i>
                        <i data-lucide="award" class="absolute inset-0 w-[clamp(150px,35dvh,250px)] h-auto ${badgeColor}"></i>
                        <div class="absolute inset-0 flex items-center justify-center flex-col pt-[15%]">
                            <span class="text-white font-black text-[clamp(2.5rem,6dvh,4.5rem)] drop-shadow-md">${score * 100}</span>
                        </div>
                    </div>
                    <div class="bg-white/90 px-[2dvw] py-[1.5dvh] rounded-[clamp(1.5rem,3dvh,2.5rem)] border-[clamp(3px,0.5dvh,6px)] border-white shadow-lg z-10 w-[95%] text-center relative mt-[2dvh]">
                        <div class="absolute -top-[1.5dvh] left-1/2 transform -translate-x-1/2 bg-gray-700 text-white text-[clamp(0.8rem,2dvh,1.2rem)] font-bold px-[1dvw] py-[0.5dvh] rounded-full whitespace-nowrap">最終稱號</div>
                        <h2 class="text-[clamp(1.8rem,4dvh,2.8rem)] font-black text-gray-800 drop-shadow-sm tracking-wide mt-[1dvh]">${title}</h2>
                    </div>
                </div>

                <!-- 右側：官方認證與詳細數據區 -->
                <div class="w-7/12 h-full flex flex-col justify-between py-0">
                    <div class="flex items-center gap-[1.5dvw] bg-gray-50/80 px-[2dvw] py-[1.5dvh] rounded-full border-2 border-gray-200 shadow-sm w-max flex-shrink-0">
                        <img src="image_1c45dd.png" class="h-[clamp(30px,6dvh,60px)] object-contain" />
                        <h3 class="text-[clamp(1rem,2.5dvh,1.8rem)] font-black text-green-800 tracking-widest pt-1">南投縣政府環境保護局</h3>
                    </div>

                    <div class="flex-1 min-h-0 bg-blue-50 p-[clamp(1.5rem,4dvh,3rem)] rounded-[clamp(1.5rem,4dvh,3rem)] border-[clamp(3px,0.5dvh,6px)] border-dashed border-blue-300 shadow-inner flex flex-col items-center justify-center my-[2dvh]">
                        <div class="flex items-center gap-[1dvw] mb-[2.5dvh] flex-shrink-0">
                            <i data-lucide="party-popper" class="w-[clamp(2rem,5dvh,3.5rem)] h-auto text-orange-500 animate-bounce"></i>
                            <h3 class="text-[clamp(1.5rem,3.5dvh,2.5rem)] font-black text-blue-800">闖關結果報告</h3>
                            <i data-lucide="party-popper" class="w-[clamp(2rem,5dvh,3.5rem)] h-auto text-orange-500 animate-bounce transform -scale-x-100"></i>
                        </div>
                        
                        <p class="text-[clamp(1.2rem,3dvh,2rem)] font-bold text-gray-700 leading-snug text-center mb-[4dvh] flex-shrink-0">${message}</p>

                        <div class="flex w-full justify-center gap-[3dvw] flex-shrink-0">
                            <div class="bg-white p-[clamp(1.2rem,3dvh,2rem)] rounded-[clamp(1rem,3dvh,2rem)] border-[clamp(3px,0.5dvh,6px)] border-white shadow-md flex flex-col items-center min-w-[20dvw]">
                                <div class="text-gray-500 font-bold mb-[1dvh] flex items-center gap-[0.5dvw] text-[clamp(1rem,2.5dvh,1.5rem)]"><i data-lucide="target" class="w-[clamp(1.2rem,3dvh,1.8rem)] h-auto text-orange-400"></i> 獲得分數</div>
                                <div class="text-[clamp(2.5rem,6dvh,4.5rem)] font-black text-orange-500">${score * 100}</div>
                            </div>
                            <div class="bg-white p-[clamp(1.2rem,3dvh,2rem)] rounded-[clamp(1rem,3dvh,2rem)] border-[clamp(3px,0.5dvh,6px)] border-white shadow-md flex flex-col items-center min-w-[20dvw]">
                                <div class="text-gray-500 font-bold mb-[1dvh] flex items-center gap-[0.5dvw] text-[clamp(1rem,2.5dvh,1.5rem)]"><i data-lucide="swords" class="w-[clamp(1.2rem,3dvh,1.8rem)] h-auto text-green-500"></i> 擊敗怪獸</div>
                                <div class="text-[clamp(2.5rem,6dvh,4.5rem)] font-black text-green-600">${score}<span class="text-[clamp(1.5rem,4dvh,3rem)] text-gray-300 ml-1">/9</span></div>
                            </div>
                        </div>
                    </div>

                    <button onclick="handleStart()" class="flex-shrink-0 grid-btn w-full bg-gradient-to-b from-blue-500 to-blue-700 text-white font-black text-[clamp(1.5rem,3.5dvh,2.5rem)] py-[clamp(1.2rem,2.5dvh,2rem)] rounded-[clamp(1.5rem,4dvh,3rem)] flex items-center justify-center gap-[1dvw] hover:from-blue-600 hover:to-blue-800">
                        <i data-lucide="refresh-ccw" class="w-[clamp(2rem,4.5dvh,3.5rem)] h-auto"></i> 再玩一次
                    </button>
                </div>
            </div>
            `;
        }

        render();
    </script>
</body>
</html>
