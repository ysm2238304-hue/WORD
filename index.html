<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>環保小尖兵-平板九宮格闖關</title>

    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 橫向模式鎖定提示 */
        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
            #app { display: none; }
        }
        @media screen and (orientation: landscape) {
            .portrait-warning { display: none; }
            #app { display: block; }
        }

        /* 擴充動畫特效 */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce-slow { 0%, 100% { transform: translateY(-5%); } 50% { transform: translateY(5%); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-zoom-in { animation: zoom-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; }
        .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        /* 隱藏捲軸，徹底變成App體驗 */
        body { overflow: hidden; touch-action: none; }
        
        /* 九宮格與按鈕立體感 */
        .grid-btn {
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .grid-btn:active {
            transform: translateY(8px) !important;
            box-shadow: 0 0 0 rgba(0,0,0,0.15) !important;
        }
        .grid-btn.disabled {
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transform: translateY(4px);
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] bg-blue-50 font-sans text-gray-800 h-screen w-screen overflow-hidden flex items-center justify-center">

    <!-- 直式螢幕警告 -->
    <div class="portrait-warning fixed inset-0 z-50 bg-blue-600 text-white flex-col items-center justify-center p-8 text-center">
        <i data-lucide="rotate-ccw" class="w-24 h-24 mb-6 animate-spin-slow"></i>
        <h1 class="text-3xl font-black mb-4">請將平板轉為橫向使用</h1>
        <p class="text-xl">此遊戲專為橫向螢幕(Landscape)設計，以獲得最佳體驗！</p>
    </div>

    <!-- 背景裝飾 -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 overflow-hidden">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[60%] bg-cyan-200/40 rounded-full blur-3xl"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[70%] bg-green-200/40 rounded-full blur-3xl"></div>
        <div class="absolute top-[20%] left-[20%] w-32 h-12 bg-white/60 rounded-full blur-sm animate-[pulse_5s_ease-in-out_infinite]"></div>
        <div class="absolute top-[60%] right-[15%] w-48 h-16 bg-white/60 rounded-full blur-sm animate-[pulse_7s_ease-in-out_infinite]"></div>
    </div>

    <!-- 遊戲主要容器 -->
    <div id="app" class="relative z-10 w-full max-w-[1350px] h-[92vh] mx-auto p-4 lg:p-6 flex items-center justify-center"></div>

    <script>
        // --- 實體化立體怪獸設計 (純 CSS + Lucide) - 放大版 ---
        const monsters = {
            cigarette: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-24 h-40 bg-gradient-to-b from-white from-50% to-orange-400 to-50% rounded-full border-[6px] border-gray-400 shadow-[10px_10px_0_rgba(0,0,0,0.15)] flex flex-col items-center justify-between py-5 relative animate-float">
                    <div class="flex gap-3 mt-4">
                        <div class="w-4 h-4 bg-gray-800 rounded-full"></div>
                        <div class="w-4 h-4 bg-gray-800 rounded-full"></div>
                    </div>
                    <div class="w-8 h-3 bg-gray-800 rounded-full mb-6"></div>
                    <i data-lucide="wind" class="w-14 h-14 text-gray-400 absolute -top-12 animate-pulse"></i>
                </div>
            </div>`,
            plastic: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-36 h-36 bg-gradient-to-br from-amber-300 to-orange-500 rounded-[2.5rem] border-[6px] border-amber-700 shadow-[12px_12px_0_rgba(180,83,9,0.25)] flex items-center justify-center relative transform rotate-12 animate-float">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-30"></div>
                    <i data-lucide="skull" class="w-20 h-20 text-amber-900 z-10 drop-shadow-md"></i>
                </div>
            </div>`,
            grandpa: `<div class="relative w-full h-full flex items-center justify-center scale-[1.4] md:scale-[1.6] lg:scale-[1.75]">
                <div class="flex flex-col items-center animate-float">
                    <div class="w-24 h-24 bg-amber-200 rounded-full border-[6px] border-gray-700 shadow-lg flex items-center justify-center relative z-10">
                        <div class="flex gap-2 absolute top-6">
                            <div class="w-8 h-8 border-[4px] border-gray-700 rounded-full bg-white flex items-center justify-center"><div class="w-3 h-3 bg-gray-800 rounded-full"></div></div>
                            <div class="w-8 h-8 border-[4px] border-gray-700 rounded-full bg-white flex items-center justify-center"><div class="w-3 h-3 bg-gray-800 rounded-full"></div></div>
                        </div>
                        <div class="w-8 h-2 bg-gray-400 rounded-full absolute bottom-4"></div>
                    </div>
                    <div class="w-32 h-20 bg-blue-600 rounded-t-[2.5rem] border-[6px] border-gray-700 shadow-xl -mt-5 relative z-0"></div>
                </div>
            </div>`,
            ticket: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-32 h-40 bg-gradient-to-b from-yellow-100 to-yellow-300 border-[6px] border-yellow-600 shadow-[10px_10px_0_rgba(202,138,4,0.3)] flex flex-col items-center justify-between py-4 relative animate-float rounded-xl">
                    <div class="w-16 h-3 bg-yellow-600 rounded-full mb-2"></div>
                    <div class="flex gap-3">
                        <div class="w-5 h-5 bg-red-500 border-[3px] border-red-700 rounded-full flex items-center justify-center"><div class="w-1 h-1 bg-white rounded-full"></div></div>
                        <div class="w-5 h-5 bg-red-500 border-[3px] border-red-700 rounded-full flex items-center justify-center"><div class="w-1 h-1 bg-white rounded-full"></div></div>
                    </div>
                    <i data-lucide="receipt" class="w-16 h-16 text-yellow-700 drop-shadow-md"></i>
                    <div class="text-2xl font-black text-yellow-800">$</div>
                </div>
            </div>`,
            block: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-36 h-36 bg-gradient-to-br from-purple-500 to-indigo-700 rounded-2xl border-[6px] border-indigo-900 shadow-[12px_12px_0_rgba(49,46,129,0.4)] flex flex-col items-center justify-center relative transform -rotate-6 animate-float">
                    <div class="flex gap-4 absolute top-6">
                        <div class="w-8 h-3 bg-indigo-900 transform rotate-12"></div>
                        <div class="w-8 h-3 bg-indigo-900 transform -rotate-12"></div>
                    </div>
                    <div class="flex gap-6 mt-6">
                        <div class="w-4 h-4 bg-white rounded-full"></div>
                        <div class="w-4 h-4 bg-white rounded-full"></div>
                    </div>
                    <i data-lucide="ban" class="w-16 h-16 text-pink-400 mt-2 drop-shadow-md"></i>
                </div>
            </div>`,
            water: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-36 h-36 bg-gradient-to-b from-cyan-300 to-blue-500 border-[6px] border-blue-700 shadow-[10px_10px_0_rgba(29,78,216,0.3)] flex flex-col items-center justify-center relative animate-float" style="border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;">
                    <div class="flex gap-4 mb-2">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center border-4 border-blue-800 shadow-inner"><div class="w-3 h-3 bg-blue-900 rounded-full"></div></div>
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center border-4 border-blue-800 shadow-inner"><div class="w-3 h-3 bg-blue-900 rounded-full"></div></div>
                    </div>
                    <div class="w-10 h-4 border-b-4 border-blue-900 rounded-full mt-1"></div>
                    <i data-lucide="droplets" class="absolute -top-6 w-12 h-12 text-cyan-200 drop-shadow-md animate-pulse"></i>
                </div>
            </div>`,
            danger: `<div class="relative w-full h-full flex items-center justify-center scale-[1.2] md:scale-[1.4] lg:scale-[1.55]">
                <div class="w-40 h-40 bg-gradient-to-tr from-orange-500 to-yellow-400 border-[6px] border-orange-800 shadow-[0_15px_0_rgba(154,52,18,1)] flex flex-col items-center justify-center relative transform rotate-45 rounded-2xl animate-float">
                    <div class="transform -rotate-45 flex flex-col items-center">
                        <div class="flex gap-4 mb-2">
                            <i data-lucide="x" class="w-8 h-8 text-orange-900 font-black"></i>
                            <i data-lucide="x" class="w-8 h-8 text-orange-900 font-black"></i>
                        </div>
                        <i data-lucide="alert-triangle" class="w-16 h-16 text-white drop-shadow-md"></i>
                    </div>
                </div>
            </div>`,
            stinky: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-40 h-36 bg-gradient-to-br from-lime-400 to-green-600 border-[6px] border-green-800 shadow-[12px_12px_0_rgba(21,128,61,0.3)] flex flex-col items-center justify-center relative animate-float" style="border-radius: 50% 60% 40% 70% / 60% 50% 70% 40%;">
                    <div class="flex gap-5 mb-2">
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center border-4 border-green-800 shadow-inner"><div class="w-3 h-3 bg-black rounded-full"></div></div>
                        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center border-4 border-green-800 shadow-inner"><div class="w-3 h-3 bg-black rounded-full"></div></div>
                    </div>
                    <i data-lucide="wind" class="w-12 h-12 text-green-900 opacity-60 absolute -top-8"></i>
                    <div class="w-10 h-8 border-b-4 border-green-900 rounded-full mt-1"></div>
                </div>
            </div>`,
            slip: `<div class="relative w-full h-full flex items-center justify-center scale-[1.3] md:scale-[1.5] lg:scale-[1.65]">
                <div class="w-36 h-36 bg-gradient-to-b from-cyan-300 to-blue-500 border-[6px] border-blue-700 shadow-[10px_10px_0_rgba(30,58,138,0.3)] flex flex-col items-center justify-center relative animate-float" style="border-radius: 50% 50% 50% 10%;">
                    <div class="flex gap-4 mb-3">
                        <div class="w-7 h-10 bg-white rounded-full flex items-center justify-center border-4 border-blue-800 shadow-inner"><div class="w-2 h-4 bg-black rounded-full mb-1"></div></div>
                        <div class="w-7 h-10 bg-white rounded-full flex items-center justify-center border-4 border-blue-800 shadow-inner"><div class="w-2 h-4 bg-black rounded-full mb-1"></div></div>
                    </div>
                    <div class="w-12 h-10 border-t-[6px] border-blue-800 rounded-full mt-2"></div>
                    <div class="absolute -right-4 top-4 w-8 h-8 bg-cyan-200 rounded-full border-[3px] border-cyan-500"></div>
                    <div class="absolute -left-6 bottom-4 w-10 h-10 bg-blue-300 rounded-full border-[3px] border-blue-600"></div>
                </div>
            </div>`
        };

        // --- 全新官方題庫 (0517版本) ---
        const questions = [
            {
                villain: '菸蒂怪', villainIcon: monsters.cigarette,
                scenario: "😱 哎呀！長著腳的【菸蒂怪】正準備跳進水溝裡！",
                question: "請問亂丟菸蒂到水溝，最後會順著水流流到哪裡造成生態污染呢?",
                options: ["(A) 美麗的大海裡", "(B) 遙遠的外太空"], correctAnswer: 0,
                explanation: "水溝不是煙灰缸，菸蒂會順著管線流進大海，毒害海洋生物喔！"
            },
            {
                villain: '塑膠濾嘴怪', villainIcon: monsters.plastic,
                scenario: "🤔 【塑膠濾嘴怪】笑著說：「我是紙做的，很快就爛掉啦！」",
                question: "其實菸蒂的濾嘴是塑膠做的，請問它在大自然中大約需要多久才能分解？",
                options: ["(A) 1個禮拜", "(B) 15年以上"], correctAnswer: 1,
                explanation: "菸蒂含有毒物質與塑膠微粒，極難分解，千萬別被騙了！"
            },
            {
                villain: '迷路阿伯', villainIcon: monsters.grandpa,
                scenario: "👴 遇到家裡的長輩抽完菸，不知道要把菸蒂丟哪...",
                question: "如果看到家裡的長輩抽完菸，我們應該提醒他把菸蒂丟在哪裡才是對的？",
                options: ["(A) 菸蒂收集桶", "(B) 垃圾桶"], correctAnswer: 0,
                explanation: "丟進專用的「菸蒂收集桶」最安全！如果只能丟垃圾桶，一定要確實熄滅才不會引發火災喔！"
            },
            {
                villain: '罰單怪', villainIcon: monsters.ticket,
                scenario: "💸 氣噗噗的【罰單怪】出現了！亂丟垃圾是不對的行為！",
                question: "在路上亂丟菸蒂，除了會把環境弄髒，還會被環保局罰多少錢呢？",
                options: ["(A) 不會被罰錢，下次記得丟進垃圾桶就好", "(B) 依廢棄物清理法，要繳1,200到6,000元罰鍰！"], correctAnswer: 1,
                explanation: "亂丟菸蒂不僅破壞環境，還會讓荷包大失血！請大家發揮公德心喔！"
            },
            {
                villain: '阻塞怪', villainIcon: monsters.block,
                scenario: "🚽 方方正正的【阻塞怪】，想跟著擦手紙一起衝進馬桶裡！",
                question: "如果公廁貼著「衛生紙丟馬桶」，洗完手用的「擦手紙」也可以跟著丟進馬桶嗎?",
                options: ["(A) 不可以，擦手紙不容易分解，會讓馬桶塞住", "(B) 可以，只要是紙類都可以丟進馬桶裡"], correctAnswer: 0,
                explanation: "擦手紙為了吸水，材質比較強韌，沒辦法在水裡快速分解，一定要丟垃圾桶喔！"
            },
            {
                villain: '省水怪', villainIcon: monsters.water,
                scenario: "💧 【省水怪】指著馬桶上的按鈕，考驗你的環保知識！",
                question: "現在很多馬桶上面有「一大一小」兩個沖水按鈕，請問「小按鈕」代表什麼意思？",
                options: ["(A) 沖水的聲音比較小，怕吵的時候按的", "(B) 沖小便用的，水量比較少，可以節約用水"], correctAnswer: 1,
                explanation: "小按鈕是為了「省水」設計的！上小號時按小按鈕，就能節約珍貴的水資源。"
            },
            {
                villain: '危險怪', villainIcon: monsters.danger,
                scenario: "🤸 尖尖的【危險怪】示範了一個超可怕的動作：踩在馬桶上！",
                question: "看到「坐式馬桶」時，應該怎麼使用才安全又衛生？",
                options: ["(A) 練武功，雙腳踩在馬桶座上", "(B) 乖乖坐著使用"], correctAnswer: 1,
                explanation: "蹲踩在坐式馬桶上非常危險，陶瓷破裂會讓人受重傷！請務必坐著使用。"
            },
            {
                villain: '臭臭怪', villainIcon: monsters.stinky,
                scenario: "🤢 上完廁所，【臭臭怪】希望大家直接離開不要沖水...",
                question: "為了讓下一個使用者有乾淨的廁所可以用，離開前最重要的一個動作是什麼？",
                options: ["(A) 沖水", "(B) 什麼都不做直接離開"], correctAnswer: 0,
                explanation: "隨手沖水是基本的公廁禮儀，大家一起保持乾淨不發臭！"
            },
            {
                villain: '滑倒怪', villainIcon: monsters.slip,
                scenario: "💦 趕時間的【滑倒怪】，洗完手用力把水狂甩在地板上！",
                question: "為了趕快出去玩，上完廁所洗完手只要用力把水甩在地板上就好，請問這樣正確嗎?",
                options: ["(A) 錯誤", "(B) 正確"], correctAnswer: 0,
                explanation: "地板積水很容易害別人滑倒受傷！洗完手請在洗手台上方甩乾，或用擦手紙擦乾喔。"
            }
        ];

        // --- 遊戲狀態管理 ---
        let gameState = 'start'; 
        let currentQ = 0;
        let score = 0;
        let answeredStatus = new Array(9).fill(null); 
        let feedback = null;

        const appDiv = document.getElementById('app');

        // 糖果配色九宮格
        const gridColors = [
            'bg-red-400 text-red-900', 'bg-orange-400 text-orange-900', 'bg-amber-400 text-amber-900',
            'bg-green-400 text-green-900', 'bg-emerald-400 text-emerald-900', 'bg-teal-400 text-teal-900',
            'bg-cyan-400 text-cyan-900', 'bg-blue-400 text-blue-900', 'bg-indigo-400 text-indigo-900'
        ];

        function render() {
            if (gameState === 'start') appDiv.innerHTML = renderStart();
            else if (gameState === 'grid') appDiv.innerHTML = renderGrid();
            else if (gameState === 'playing') appDiv.innerHTML = renderPlaying();
            else if (gameState === 'result') appDiv.innerHTML = renderResult();
            lucide.createIcons();
        }

        window.handleStart = function() {
            gameState = 'grid'; answeredStatus = new Array(9).fill(null); score = 0; render();
        }

        window.selectQuestion = function(idx) {
            if (answeredStatus[idx] !== null) return; 
            currentQ = idx; gameState = 'playing'; feedback = null; render();
        }

        window.handleAnswer = function(idx) {
            if (feedback !== null) return; 
            const isCorrect = idx === questions[currentQ].correctAnswer;
            if (isCorrect) score += 1;
            answeredStatus[currentQ] = isCorrect;
            feedback = { isCorrect: isCorrect, text: questions[currentQ].explanation };
            render();
        }

        window.handleNext = function() {
            let completedCount = answeredStatus.filter(s => s !== null).length;
            if (completedCount === 9) gameState = 'result'; else gameState = 'grid';
            render();
        }

        // 1. 首頁 (全新任務卡風格歡迎語)
        function renderStart() {
            return `
            <div class="w-full h-full bg-white/95 backdrop-blur-md rounded-[2.5rem] shadow-2xl border-[10px] border-white p-6 md:p-10 flex flex-col md:flex-row items-center justify-center gap-6 lg:gap-12 animate-zoom-in">
                <!-- 左側：視覺插圖 -->
                <div class="md:w-5/12 flex items-center justify-center animate-bounce-slow h-full">
                    <div class="aspect-square w-full max-w-[280px] lg:max-w-[340px] bg-gradient-to-tr from-green-300 to-green-500 rounded-full flex items-center justify-center shadow-[0_15px_40px_rgba(34,197,94,0.3)] border-[12px] border-white relative">
                        <i data-lucide="leaf" class="w-24 h-24 lg:w-32 lg:h-32 text-white"></i>
                        <i data-lucide="sparkles" class="w-10 h-10 lg:w-14 lg:h-14 text-yellow-300 absolute top-4 right-4 animate-pulse"></i>
                    </div>
                </div>
                <!-- 右側：標題與按鈕 -->
                <div class="md:w-7/12 flex flex-col items-center md:items-start justify-center h-full">
                    <div class="flex items-center justify-center md:justify-start gap-4 mb-6 bg-white shadow-sm border-2 border-gray-100 rounded-full py-3 px-6 w-max mx-auto md:mx-0">
                        <img src="image_1c45dd.png" alt="南投環保局標誌" class="w-14 h-14 lg:w-16 lg:h-16 object-contain" />
                        <h2 class="text-green-800 font-black text-2xl lg:text-3xl tracking-widest pt-1">南投縣政府環境保護局</h2>
                    </div>
                    
                    <h1 class="text-4xl md:text-5xl lg:text-6xl font-black text-blue-800 mb-6 leading-tight drop-shadow-md text-center md:text-left">
                        環保小尖兵<br/><span class="text-orange-500 text-3xl md:text-4xl lg:text-5xl mt-2 block">沙包挑戰賽！</span>
                    </h1>
                    
                    <!-- 更新後的三列排版風格 -->
                    <div class="w-full bg-blue-50/80 p-5 lg:p-7 rounded-[2rem] border-[4px] border-dashed border-blue-300 shadow-inner mb-6 lg:mb-8 flex-shrink-0 relative flex flex-col justify-center">
                        <h3 class="text-center font-black text-2xl lg:text-3xl text-orange-600 mb-4 tracking-widest drop-shadow-sm">
                            ~~ 歡迎來到敦和國小 ~~
                        </h3>
                        <div class="w-full px-2 flex flex-col gap-2">
                            <p class="text-gray-800 font-black text-xl lg:text-2xl leading-relaxed text-center md:text-left">
                                快拿起手上的沙包，丟向九宮格選擇題目，
                            </p>
                            <p class="text-blue-700 font-black text-2xl lg:text-3xl leading-relaxed text-center md:text-right drop-shadow-sm mt-1">
                                一起打敗污染怪獸吧!!!
                            </p>
                        </div>
                    </div>

                    <button onclick="handleStart()" class="grid-btn w-[80%] md:w-auto bg-gradient-to-b from-green-400 to-green-600 text-white font-black text-2xl lg:text-3xl py-4 lg:py-5 px-8 lg:px-12 rounded-full flex items-center justify-center gap-3 cursor-pointer hover:from-green-500 hover:to-green-700">
                        <i data-lucide="play-circle" class="w-8 h-8 lg:w-10 lg:h-10"></i> 開始挑戰！
                    </button>
                </div>
            </div>
            `;
        }

        // 2. 九宮格選單
        function renderGrid() {
            let gridHtml = answeredStatus.map((status, i) => {
                let isDone = status !== null;
                let btnColor = isDone ? 'bg-gray-200 text-gray-400 disabled' : gridColors[i];
                let contentHtml = `<span class="text-5xl md:text-7xl font-black drop-shadow-lg">${i + 1}</span>`;
                if (isDone) {
                    if (status === true) contentHtml = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="check-circle" class="w-20 h-20 text-green-500 opacity-80 rotate-12"></i></div>`;
                    else contentHtml = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="x-circle" class="w-20 h-20 text-red-400 opacity-80 -rotate-12"></i></div>`;
                }
                return `
                <button onclick="selectQuestion(${i})" class="grid-btn relative aspect-square rounded-[1.5rem] md:rounded-[2rem] flex items-center justify-center border-4 border-white/60 overflow-hidden group ${btnColor}">
                    ${isDone ? '' : '<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>'}
                    ${contentHtml}
                </button>
                `;
            }).join('');

            return `
            <div class="w-full h-full flex flex-col md:flex-row gap-6 lg:gap-10 animate-fade-in">
                <!-- 左側狀態 -->
                <div class="md:w-1/3 h-full flex flex-col justify-between bg-white/90 backdrop-blur-md p-6 lg:p-8 rounded-[2.5rem] shadow-2xl border-[8px] border-white relative">
                    
                    <!-- 分兩列的標語框 -->
                    <div class="flex flex-col items-center justify-center gap-3 mb-2 bg-gradient-to-b from-green-50 to-blue-50 px-4 lg:px-6 py-5 rounded-[1.5rem] border-[3px] border-white shadow-md flex-shrink-0 w-full mx-auto">
                        <div class="flex items-center justify-center gap-3 w-full">
                            <i data-lucide="sparkles" class="w-8 h-8 text-yellow-500 drop-shadow-sm animate-pulse flex-shrink-0"></i>
                            <h2 class="text-green-800 font-black text-2xl lg:text-[1.7rem] tracking-widest drop-shadow-sm text-center">公廁亮晶晶</h2>
                        </div>
                        <div class="w-[80%] h-[2px] bg-gray-300/50 rounded-full"></div>
                        <div class="flex items-center justify-center gap-3 w-full">
                            <h2 class="text-blue-800 font-black text-2xl lg:text-[1.7rem] tracking-widest drop-shadow-sm text-center">無菸好環境</h2>
                            <i data-lucide="droplets" class="w-8 h-8 text-cyan-500 drop-shadow-sm animate-bounce-slow flex-shrink-0"></i>
                        </div>
                    </div>

                    <div class="flex flex-col items-center justify-center flex-1 my-2">
                        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center border-4 border-green-400 shadow-md mb-4">
                            <i data-lucide="leaf" class="w-10 h-10 text-green-500"></i>
                        </div>
                        <h2 class="text-3xl font-black text-gray-800 mb-2">請選題！</h2>
                        <p class="text-green-600 font-bold text-xl">目前得分：<span class="text-4xl text-orange-500 ml-2 drop-shadow-sm">${score * 100}</span></p>
                    </div>

                    <div class="bg-blue-50/80 p-5 rounded-[2rem] border-4 border-dashed border-blue-300 flex flex-col items-center justify-center flex-shrink-0">
                        <i data-lucide="target" class="w-12 h-12 text-blue-500 mb-2 animate-bounce"></i>
                        <p class="text-lg lg:text-xl font-bold text-center text-gray-700 leading-snug">
                            沙包丟中幾號呢？<br/><span class="text-blue-600 font-black">點擊右邊對應號碼</span>
                        </p>
                    </div>
                </div>

                <!-- 右側九宮格 -->
                <div class="md:w-2/3 h-full bg-white/70 backdrop-blur-md p-6 lg:p-10 rounded-[2.5rem] shadow-2xl border-[8px] border-white flex items-center justify-center">
                    <div class="w-full max-w-[600px] grid grid-cols-3 gap-4 lg:gap-6">
                        ${gridHtml}
                    </div>
                </div>
            </div>
            `;
        }

        // 3. 遊戲答題中 (怪獸大幅放大)
        function renderPlaying() {
            const q = questions[currentQ];
            let optionsHtml = q.options.map((opt, idx) => {
                let btnStateClass = feedback === null 
                    ? 'bg-white border-gray-300 text-gray-700 hover:bg-blue-50 hover:border-blue-400 grid-btn cursor-pointer' 
                    : (idx === q.correctAnswer ? 'bg-green-100 border-green-500 text-green-800 shadow-inner' : 'bg-gray-100 border-gray-200 text-gray-400');
                return `
                <button ${feedback !== null ? 'disabled' : ''} onclick="handleAnswer(${idx})" class="w-full text-left p-4 lg:p-6 rounded-[1.5rem] font-black text-lg lg:text-xl xl:text-2xl border-[4px] lg:border-[6px] relative flex justify-between items-center ${btnStateClass}">
                    <span>${opt}</span>
                    ${feedback === null ? `<i data-lucide="mouse-pointer-click" class="w-6 h-6 opacity-30 flex-shrink-0 ml-2"></i>` : ''}
                </button>
                `;
            }).join('');

            let feedbackHtml = '';
            if (feedback) {
                feedbackHtml = `
                <div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-gray-900/70 backdrop-blur-sm rounded-[2rem] animate-fade-in">
                    <div class="bg-white w-full max-w-xl rounded-[2.5rem] p-8 shadow-2xl flex flex-col items-center text-center transform animate-zoom-in border-[10px] ${feedback.isCorrect ? 'border-green-400' : 'border-orange-400'}">
                        ${feedback.isCorrect ? `
                            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4 border-[4px] border-green-400 animate-bounce">
                                <i data-lucide="check-circle" class="w-12 h-12 text-green-500"></i>
                            </div>
                            <h3 class="text-4xl font-black text-green-600 mb-4">攻擊成功！</h3>
                        ` : `
                            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mb-4 border-[4px] border-red-400">
                                <i data-lucide="x-circle" class="w-12 h-12 text-red-500"></i>
                            </div>
                            <h3 class="text-4xl font-black text-red-600 mb-4">哎呀！打歪了</h3>
                        `}
                        <p class="text-gray-700 font-bold text-xl mb-8 leading-snug bg-gray-50 p-4 rounded-2xl w-full border-2 border-gray-200">${feedback.text}</p>
                        <button onclick="handleNext()" class="grid-btn w-full py-4 rounded-full font-black text-2xl text-white shadow-lg flex items-center justify-center gap-3 ${feedback.isCorrect ? 'bg-green-500' : 'bg-orange-500'} cursor-pointer">
                            返回九宮格 <i data-lucide="arrow-right-circle" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>
                `;
            }

            let villainClass = feedback ? (feedback.isCorrect ? 'scale-75 rotate-12 opacity-30 grayscale blur-md' : 'scale-125 -rotate-12 drop-shadow-2xl') : '';

            return `
            <div class="w-full h-full bg-white/95 backdrop-blur-xl rounded-[2.5rem] shadow-2xl border-[10px] border-white p-5 lg:p-8 flex flex-col md:flex-row gap-6 lg:gap-8 animate-slide-up relative overflow-hidden">
                <!-- 左側：怪獸展示區 (實體化巨型怪獸) -->
                <div class="md:w-5/12 h-full bg-gradient-to-b from-gray-100 to-gray-200 rounded-[2rem] p-4 lg:p-6 flex flex-col items-center justify-between border-8 border-gray-300 relative shadow-inner overflow-hidden">
                    <div class="absolute top-4 left-4 bg-blue-600 text-white font-black px-4 py-2 rounded-xl text-base shadow-md border-2 border-blue-400 z-20 flex items-center gap-2">
                        <i data-lucide="hash" class="w-5 h-5"></i> 題 ${currentQ + 1}
                    </div>
                    
                    <!-- 放大的實體化怪獸框 -->
                    <div class="flex-1 w-full min-h-0 flex items-center justify-center my-2 relative">
                        <div class="absolute w-[85%] aspect-square bg-gray-300/40 rounded-full blur-xl transform translate-y-12"></div>
                        <div class="w-full h-full flex items-center justify-center transition-all duration-700 ${villainClass} relative z-10">
                            ${q.villainIcon}
                        </div>
                    </div>
                    
                    <div class="bg-white/90 px-6 py-3 rounded-[1.5rem] border-4 border-gray-300 text-center shadow-md z-20 w-full flex-shrink-0">
                        <span class="text-sm font-bold text-gray-500 block mb-1">遇到污染怪獸：</span>
                        <span class="text-2xl lg:text-4xl font-black text-red-600 drop-shadow-sm line-clamp-1">${q.villain}</span>
                    </div>
                </div>

                <!-- 右側：問答區 -->
                <div class="md:w-7/12 h-full flex flex-col justify-between py-2">
                    <div class="flex-shrink-0 bg-amber-100 text-amber-900 font-black p-3 lg:p-4 rounded-xl mb-3 lg:mb-4 border-l-[8px] border-amber-400 shadow-sm text-lg flex items-center gap-3">
                        <i data-lucide="alert-circle" class="w-8 h-8 text-amber-600 flex-shrink-0"></i>
                        <span class="leading-snug line-clamp-2">${q.scenario}</span>
                    </div>
                    <div class="flex-1 min-h-0 bg-blue-50 p-4 lg:p-6 rounded-[2rem] border-4 border-blue-200 shadow-inner mb-4 lg:mb-6 flex items-center justify-center text-center overflow-hidden">
                        <h2 class="text-xl md:text-3xl lg:text-4xl font-black text-gray-800 leading-snug drop-shadow-sm">
                            ${q.question}
                        </h2>
                    </div>
                    <div class="flex-shrink-0 grid gap-4 lg:gap-5">
                        ${optionsHtml}
                    </div>
                </div>
                ${feedbackHtml}
            </div>
            `;
        }

        // 4. 結算畫面 (左右分版設計)
        function renderResult() {
            let title = score === 9 ? "完美通關神射手！" : (score >= 6 ? "優秀環保尖兵！" : "再接再厲小尖兵！");
            let message = score === 9 ? "太厲害了！你消滅了所有的污染怪獸，成功守護了敦和國小！" : 
                         (score >= 6 ? "表現不錯喔！擊退了大部分的怪獸，繼續保持環保好習慣！" : "怪獸還在搗蛋！重新拿好沙包，再挑戰一次吧！");
            
            // 依據分數給予不同顏色與星級
            let badgeColor = score === 9 ? "text-yellow-500" : (score >= 6 ? "text-blue-500" : "text-gray-400");
            let badgeBg = score === 9 ? "bg-gradient-to-b from-yellow-50 to-orange-100 border-yellow-300" : 
                         (score >= 6 ? "bg-gradient-to-b from-blue-50 to-cyan-100 border-blue-300" : "bg-gradient-to-b from-gray-50 to-gray-200 border-gray-300");
            
            let starCount = score === 9 ? 3 : (score >= 6 ? 2 : 1);
            let starsHtml = '<div class="flex justify-center items-end gap-2 mb-4">';
            for(let i=0; i<3; i++) {
                let isCenter = i === 1;
                let sizeClass = isCenter ? 'w-20 h-20 mb-4' : 'w-14 h-14';
                let colorClass = i < starCount ? 'text-yellow-400' : 'text-gray-300 opacity-50';
                let fillStyle = i < starCount ? 'fill: currentColor' : 'fill: none';
                starsHtml += `<i data-lucide="star" class="${sizeClass} ${colorClass} drop-shadow-md animate-bounce-slow" style="animation-delay: ${i*0.2}s; ${fillStyle}"></i>`;
            }
            starsHtml += '</div>';

            return `
            <div class="w-full h-full bg-white/95 backdrop-blur-xl rounded-[3rem] shadow-2xl border-[10px] border-white p-5 lg:p-8 flex flex-col md:flex-row gap-6 lg:gap-8 animate-zoom-in relative overflow-hidden">
                <!-- 背景光暈裝飾 -->
                <div class="absolute top-[-20%] right-[-10%] w-96 h-96 bg-yellow-200/40 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute bottom-[-10%] left-[-10%] w-80 h-80 bg-blue-200/40 rounded-full blur-3xl pointer-events-none"></div>

                <!-- 左側：榮譽勳章與評價區 (佔 5/12) -->
                <div class="md:w-5/12 h-full rounded-[2.5rem] p-6 flex flex-col items-center justify-center border-8 ${badgeBg} relative shadow-inner overflow-hidden flex-shrink-0">
                    <i data-lucide="sparkles" class="absolute top-8 left-8 w-10 h-10 text-yellow-400 animate-pulse opacity-80"></i>
                    <i data-lucide="sparkles" class="absolute bottom-12 right-8 w-12 h-12 text-yellow-500 animate-pulse opacity-80"></i>

                    <!-- 動態星級評價 -->
                    ${starsHtml}

                    <div class="relative animate-float my-2">
                        <i data-lucide="award" class="w-40 h-40 lg:w-48 lg:h-48 ${badgeColor} drop-shadow-[0_15px_20px_rgba(0,0,0,0.15)]" style="fill: currentColor; opacity: 0.2"></i>
                        <i data-lucide="award" class="absolute inset-0 w-40 h-40 lg:w-48 lg:h-48 ${badgeColor}"></i>
                        <div class="absolute inset-0 flex items-center justify-center flex-col pt-6 lg:pt-8">
                            <span class="text-white font-black text-4xl lg:text-5xl drop-shadow-md">${score * 100}</span>
                        </div>
                    </div>

                    <div class="mt-6 bg-white/90 px-6 py-4 rounded-3xl border-4 border-white shadow-lg z-10 w-[95%] text-center relative">
                        <div class="absolute -top-3 left-1/2 transform -translate-x-1/2 bg-gray-700 text-white text-xs font-bold px-3 py-1 rounded-full">最終稱號</div>
                        <h2 class="text-3xl lg:text-4xl font-black text-gray-800 drop-shadow-sm tracking-wide mt-2">${title}</h2>
                    </div>
                </div>

                <!-- 右側：官方認證與詳細數據區 (佔 7/12) -->
                <div class="md:w-7/12 h-full flex flex-col justify-between py-2">
                    
                    <!-- 官方認證頭部 -->
                    <div class="flex items-center justify-center md:justify-start gap-3 mb-2 bg-gray-50/80 px-6 py-3 rounded-full border-2 border-gray-200 shadow-sm w-max mx-auto md:mx-0 flex-shrink-0">
                        <img src="image_1c45dd.png" class="w-10 h-10 lg:w-12 lg:h-12 object-contain" />
                        <h3 class="text-xl lg:text-2xl font-black text-green-800 tracking-widest pt-1">南投縣政府環境保護局</h3>
                    </div>

                    <!-- 遊戲數據儀表板 -->
                    <div class="flex-1 min-h-0 bg-blue-50 p-6 lg:p-8 rounded-[2.5rem] border-4 border-dashed border-blue-300 shadow-inner flex flex-col items-center justify-center mb-5 lg:mb-6 mt-4">
                        <div class="flex items-center gap-3 mb-4">
                            <i data-lucide="party-popper" class="w-10 h-10 text-orange-500 animate-bounce"></i>
                            <h3 class="text-2xl font-black text-blue-800">闖關結果報告</h3>
                            <i data-lucide="party-popper" class="w-10 h-10 text-orange-500 animate-bounce transform -scale-x-100"></i>
                        </div>
                        
                        <p class="text-xl lg:text-2xl font-bold text-gray-700 leading-snug text-center mb-8 px-4">${message}</p>

                        <div class="flex w-full justify-center gap-6 lg:gap-12">
                            <div class="bg-white px-6 py-5 rounded-[1.5rem] border-4 border-white shadow-md flex flex-col items-center min-w-[150px] transform hover:scale-105 transition-transform">
                                <div class="text-gray-500 font-bold mb-2 flex items-center gap-2"><i data-lucide="target" class="w-6 h-6 text-orange-400"></i> 獲得分數</div>
                                <div class="text-5xl font-black text-orange-500">${score * 100}</div>
                            </div>
                            <div class="bg-white px-6 py-5 rounded-[1.5rem] border-4 border-white shadow-md flex flex-col items-center min-w-[150px] transform hover:scale-105 transition-transform">
                                <div class="text-gray-500 font-bold mb-2 flex items-center gap-2"><i data-lucide="swords" class="w-6 h-6 text-green-500"></i> 擊敗怪獸</div>
                                <div class="text-5xl font-black text-green-600">${score}<span class="text-3xl text-gray-300 ml-1">/9</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- 操作按鈕區 -->
                    <button onclick="handleStart()" class="flex-shrink-0 grid-btn w-full bg-gradient-to-b from-blue-500 to-blue-700 text-white font-black text-2xl lg:text-3xl py-4 lg:py-5 rounded-[2rem] flex items-center justify-center gap-4 cursor-pointer hover:from-blue-600 hover:to-blue-800">
                        <i data-lucide="refresh-ccw" class="w-8 h-8 lg:w-10 lg:h-10"></i> 再玩一次
                    </button>
                </div>
            </div>
            `;
        }

        render();
    </script>
</body>
</html>
