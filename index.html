<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>環保小尖兵互動闖關</title>

    <!-- 引入 Tailwind CSS 進行快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Lucide 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* 自訂擴充動畫特效 */
        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slide-in-right { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }
        .animate-zoom-in { animation: zoom-in 0.3s ease-out forwards; }
        .animate-slide-in-right { animation: slide-in-right 0.5s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-cyan-100 via-blue-100 to-green-100 font-sans overflow-x-hidden text-gray-800">

    <!-- 飄動的雲朵背景裝飾 -->
    <div class="fixed top-10 left-10 w-24 h-8 bg-white/40 rounded-full blur-sm animate-[pulse_4s_ease-in-out_infinite] pointer-events-none"></div>
    <div class="fixed top-40 right-20 w-32 h-10 bg-white/40 rounded-full blur-sm animate-[pulse_6s_ease-in-out_infinite] pointer-events-none"></div>

    <!-- 遊戲主要容器 -->
    <div id="app"></div>

    <script>
        // --- 遊戲題庫與劇情設定 ---
        const questions = [
            {
                villain: '菸蒂怪',
                villainIcon: '<i data-lucide="wind" class="w-16 h-16 text-gray-600"></i>',
                scenario: "😱 哎呀！一隻【菸蒂怪】正準備把菸蒂丟進水溝裡！",
                question: "請問亂丟菸蒂到水溝，最後會順著水流流到哪裡，污染生態？",
                options: ["(A) 美麗的大海裡", "(B) 遙遠的外太空"],
                correctAnswer: 0,
                explanation: "水溝不是煙灰缸，菸蒂會順著管線流進大海，毒害海洋生物喔！"
            },
            {
                villain: '塑膠濾嘴怪',
                villainIcon: '<i data-lucide="skull" class="w-16 h-16 text-amber-700"></i>',
                scenario: "🤔 【塑膠濾嘴怪】笑著說：「我是紙做的，很快就融化啦！」",
                question: "其實菸蒂濾嘴是塑膠做的！它在大自然中大約需要多久才能分解？",
                options: ["(A) 只要 1 個禮拜", "(B) 超過 10 年以上"],
                correctAnswer: 1,
                explanation: "菸蒂含有毒物質與塑膠微粒，極難分解，千萬別被騙了！"
            },
            {
                villain: '迷路阿伯',
                villainIcon: '<div class="relative flex flex-col items-center"><div class="w-10 h-10 rounded-full bg-blue-600"></div><div class="w-14 h-12 rounded-t-xl bg-blue-600 mt-1"></div></div>',
                scenario: "👴 遇到家裡的長輩或阿公抽完菸，不知道要把菸蒂丟哪...",
                question: "我們應該提醒他把菸蒂丟在哪裡才是對的？",
                options: ["(A) 彈到馬路上", "(B) 確實熄滅丟進垃圾桶"],
                correctAnswer: 1,
                explanation: "絕對不能彈到水溝或馬路上，一定要丟進專用的熄煙盒或垃圾桶！"
            },
            {
                villain: '火星怪',
                villainIcon: '<i data-lucide="flame" class="w-16 h-16 text-red-500 animate-pulse"></i>',
                scenario: "🔥 【火星怪】偷偷把還沒熄滅的菸蒂丟進了草叢！",
                question: "亂丟「還沒完全熄滅」的菸蒂，最容易引發可怕的火災！這是真的嗎？",
                options: ["⭕ 是的，非常危險！", "❌ 假的，沒關係啦！"],
                correctAnswer: 0,
                explanation: "星星之火可以燎原！菸蒂一定要確實熄滅再丟棄喔！"
            },
            {
                villain: '臭臭怪',
                villainIcon: '<i data-lucide="droplets" class="w-16 h-16 text-lime-600"></i>',
                scenario: "🤢 來到公廁，【臭臭怪】希望大家上完廁所都不要沖水...",
                question: "為了讓下一個使用者有乾淨的廁所，離開前一定要隨手沖水。對不對？",
                options: ["⭕ 對！這是有禮貌的表現", "❌ 不對！給別人沖就好"],
                correctAnswer: 0,
                explanation: "隨手沖水，保持公廁不發臭，你我都開心！"
            },
            {
                villain: '阻塞怪',
                villainIcon: '<i data-lucide="ban" class="w-16 h-16 text-purple-600"></i>',
                scenario: "🚽 【阻塞怪】拿著衛生棉和濕紙巾，想通通丟進馬桶裡！",
                question: "雖然現在提倡衛生紙丟馬桶，那「衛生棉」或「濕紙巾」可以丟進馬桶嗎？",
                options: ["(A) 不可以！會塞住", "(B) 可以！沖下去就好"],
                correctAnswer: 0,
                explanation: "衛生棉和濕紙巾無法在水中溶解，會讓馬桶嚴重阻塞，一定要丟垃圾桶！"
            },
            {
                villain: '危險怪',
                villainIcon: '<i data-lucide="alert-triangle" class="w-16 h-16 text-orange-500"></i>',
                scenario: "🤸 【危險怪】示範了一個超危險的動作：踩在坐式馬桶上！",
                question: "在公廁看到「坐式馬桶」時，我們應該怎麼上廁所才安全？",
                options: ["(A) 乖乖坐著上", "(B) 踩上去蹲著上"],
                correctAnswer: 0,
                explanation: "蹲在坐式馬桶上非常危險，陶瓷破裂會受重傷，也會把馬桶蓋弄髒喔！"
            },
            {
                villain: '滑倒怪',
                villainIcon: '<i data-lucide="droplets" class="w-16 h-16 text-cyan-500"></i>',
                scenario: "💦 【滑倒怪】洗完手後，故意把水狂甩在地上！",
                question: "洗完手如果手濕濕的到處亂甩，讓地板積水，很容易害別人滑倒受傷。是真的嗎？",
                options: ["⭕ 是真的！很危險", "❌ 假的！水很快就乾了"],
                correctAnswer: 0,
                explanation: "洗完手請在洗手台上方把手甩乾，或用手帕擦乾，保持地面乾燥！"
            },
            {
                villain: '髒亂怪',
                villainIcon: '<i data-lucide="trash-2" class="w-16 h-16 text-gray-700"></i>',
                scenario: "🏫 巡視美麗的【敦和國小】時，發現地上有別人亂丟的垃圾！",
                question: "身為環保小尖兵的你，這時候應該怎麼做？",
                options: ["(A) 裝作沒看到走掉", "(B) 撿起來丟進垃圾桶"],
                correctAnswer: 1,
                explanation: "維護校園環境，從你我做起！你就是最棒的環保小尖兵！"
            }
        ];

        // --- 遊戲狀態管理 ---
        let gameState = 'start'; // start, playing, result
        let currentQ = 0;
        let score = 0;
        let hp = 100;
        let feedback = null;

        const appDiv = document.getElementById('app');

        // --- 核心渲染函數 ---
        function render() {
            if (gameState === 'start') {
                appDiv.innerHTML = renderStart();
            } else if (gameState === 'playing') {
                appDiv.innerHTML = renderPlaying();
            } else if (gameState === 'result') {
                appDiv.innerHTML = renderResult();
            }
            
            // 重新初始化 Lucide 圖示
            lucide.createIcons();
        }

        // --- 遊戲邏輯函數 ---
        window.handleStart = function() {
            gameState = 'playing';
            currentQ = 0;
            score = 0;
            hp = 100;
            feedback = null;
            render();
        }

        window.handleAnswer = function(idx) {
            if (feedback !== null) return; // 避免重複點擊
            
            const isCorrect = idx === questions[currentQ].correctAnswer;
            if (isCorrect) {
                score += 1;
                hp = Math.max(0, hp - 15);
            }

            feedback = {
                isCorrect: isCorrect,
                text: questions[currentQ].explanation
            };
            render();
        }

        window.handleNext = function() {
            if (currentQ < questions.length - 1) {
                currentQ += 1;
                feedback = null;
            } else {
                gameState = 'result';
            }
            render();
        }

        // --- 畫面組件生成 ---

        function renderStart() {
            return `
            <div class="flex flex-col items-center justify-center min-h-[600px] text-center px-4 animate-fade-in py-12">
                <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-xl border-4 border-green-400 mb-6 relative animate-bounce">
                    <i data-lucide="leaf" class="w-16 h-16 text-green-500"></i>
                    <i data-lucide="sparkles" class="w-8 h-8 text-yellow-400 absolute top-0 right-0 animate-pulse"></i>
                </div>
                
                <div class="bg-white/90 backdrop-blur-sm p-8 rounded-3xl shadow-2xl border-4 border-white max-w-md w-full">
                    <h2 class="text-green-700 font-black text-xl mb-2 tracking-widest">南投縣政府環境保護局</h2>
                    <h1 class="text-4xl md:text-5xl font-black text-blue-600 mb-6 drop-shadow-md">
                        環保小尖兵<br/><span class="text-3xl text-orange-500">出動救援！</span>
                    </h1>
                    
                    <p class="text-gray-600 font-bold mb-8 text-lg bg-blue-50 p-4 rounded-xl">
                        糟糕！「菸蒂怪」和「髒髒怪」入侵了美麗的<span class="text-blue-600 font-black">敦和國小</span>！<br/>
                        快來回答問題，用知識的力量打敗他們吧！
                    </p>

                    <button onclick="handleStart()" class="group relative w-full bg-gradient-to-b from-green-400 to-green-600 text-white font-black text-2xl py-4 px-8 rounded-full shadow-[0_8px_0_rgb(21,128,61)] hover:shadow-[0_4px_0_rgb(21,128,61)] hover:translate-y-1 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i data-lucide="shield" class="group-hover:rotate-12 transition-transform"></i>
                        開始挑戰！
                    </button>
                </div>
            </div>
            `;
        }

        function renderPlaying() {
            const q = questions[currentQ];
            
            let optionsHtml = q.options.map((opt, idx) => {
                let btnClass = feedback === null 
                    ? 'bg-blue-50 border-blue-200 text-blue-800 hover:bg-blue-100 hover:border-blue-300 hover:shadow-md hover:-translate-y-1 cursor-pointer' 
                    : (idx === q.correctAnswer 
                        ? 'bg-green-100 border-green-400 text-green-800' 
                        : 'bg-gray-100 border-gray-200 text-gray-400');
                
                return `
                <button ${feedback !== null ? 'disabled' : ''} onclick="handleAnswer(${idx})" class="w-full text-left p-4 rounded-2xl font-bold text-lg md:text-xl transition-all duration-200 border-4 relative overflow-hidden ${btnClass}">
                    ${opt}
                </button>
                `;
            }).join('');

            let feedbackHtml = '';
            if (feedback) {
                feedbackHtml = `
                <div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm rounded-3xl animate-fade-in mt-6">
                    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col items-center text-center transform animate-zoom-in">
                        ${feedback.isCorrect ? `
                            <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mb-4 border-4 border-green-400 animate-bounce">
                                <i data-lucide="check-circle" class="w-12 h-12 text-green-500"></i>
                            </div>
                            <h3 class="text-3xl font-black text-green-600 mb-2">攻擊成功！</h3>
                        ` : `
                            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mb-4 border-4 border-red-400">
                                <i data-lucide="x-circle" class="w-12 h-12 text-red-500"></i>
                            </div>
                            <h3 class="text-3xl font-black text-red-600 mb-2">哎呀！打歪了</h3>
                        `}
                        <p class="text-gray-600 font-bold mb-6">${feedback.text}</p>
                        <button onclick="handleNext()" class="w-full py-4 rounded-xl font-black text-xl text-white shadow-lg flex items-center justify-center gap-2 transition-transform hover:scale-105 cursor-pointer ${feedback.isCorrect ? 'bg-green-500 hover:bg-green-600' : 'bg-blue-500 hover:bg-blue-600'}">
                            ${currentQ < questions.length - 1 ? '前往下一關' : '查看結果'}
                            <i data-lucide="chevron-right" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
                `;
            }

            let villainClass = feedback ? (feedback.isCorrect ? 'scale-90 rotate-12 opacity-50 grayscale' : 'scale-110 -rotate-12 animate-bounce') : 'animate-pulse';

            return `
            <div class="w-full max-w-2xl mx-auto flex flex-col min-h-[600px] animate-slide-in-right relative py-8 px-4">
                
                <!-- 頂部狀態列 -->
                <div class="bg-white rounded-2xl shadow-md p-4 mb-6 flex justify-between items-center border-b-4 border-blue-200">
                    <div class="flex items-center gap-2">
                        <div class="bg-blue-100 text-blue-700 font-black px-4 py-2 rounded-xl">
                            第 ${currentQ + 1} / ${questions.length} 關
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-bold text-gray-600">小尖兵分數：</span>
                        <span class="text-2xl font-black text-orange-500 flex items-center gap-1">
                            <i data-lucide="star" class="w-6 h-6 fill-orange-400 text-orange-400"></i> ${score * 100}
                        </span>
                    </div>
                </div>

                <!-- 怪物對戰區 -->
                <div class="flex justify-between items-end px-2 md:px-8 mb-4 relative h-32">
                    <!-- 玩家(左) -->
                    <div class="flex flex-col items-center">
                        <div class="bg-green-100 px-3 py-1 rounded-full text-green-700 font-bold text-sm mb-2 shadow-sm border border-green-300">
                            環保小尖兵
                        </div>
                        <div class="w-16 h-16 bg-white rounded-full border-4 border-green-400 flex items-center justify-center shadow-lg relative">
                            <i data-lucide="leaf" class="w-8 h-8 text-green-500"></i>
                        </div>
                    </div>

                    <!-- 怪物(右) -->
                    <div class="flex flex-col items-center relative">
                        <div class="bg-red-100 px-3 py-1 rounded-full text-red-700 font-bold text-sm mb-2 shadow-sm border border-red-300">
                            ${q.villain}
                        </div>
                        <div class="w-20 h-20 bg-gray-100 rounded-2xl border-4 border-gray-400 flex items-center justify-center shadow-lg transition-transform duration-300 ${villainClass}">
                            ${q.villainIcon}
                        </div>
                        <!-- 怪物血條 -->
                        <div class="w-24 h-3 bg-gray-200 rounded-full mt-3 overflow-hidden border border-gray-400">
                            <div class="h-full bg-red-500 transition-all duration-500" style="width: ${hp}%"></div>
                        </div>
                    </div>
                </div>

                <!-- 題目卡片 -->
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl border-4 border-white flex-1 flex flex-col relative z-10">
                    <div class="bg-amber-100 text-amber-800 font-bold p-3 rounded-xl mb-4 inline-block text-sm md:text-base border border-amber-200 shadow-inner w-fit">
                        ${q.scenario}
                    </div>
                    
                    <h2 class="text-xl md:text-3xl font-black text-gray-800 mb-8 leading-snug flex-1">
                        ${q.question}
                    </h2>

                    <div class="grid gap-4 mt-auto">
                        ${optionsHtml}
                    </div>
                </div>

                ${feedbackHtml}
            </div>
            `;
        }

        function renderResult() {
            let title = score === 9 ? "完美通關！" : (score >= 6 ? "優秀表現！" : "再接再厲！");
            let message = score === 9 ? "太厲害了！你完全消滅了污染怪獸，敦稍微國小變得超級乾淨！" : 
                         (score >= 6 ? "你擊退了大部分的怪獸，繼續保持環保好習慣喔！" : "怪獸還在搗蛋！再挑戰一次，把環保知識記起來吧！");
            let badgeColor = score === 9 ? "text-yellow-500" : (score >= 6 ? "text-blue-500" : "text-gray-400");

            return `
            <div class="flex flex-col items-center justify-center min-h-[600px] text-center px-4 animate-zoom-in py-12">
                <!-- 獎狀區塊 -->
                <div class="bg-white p-8 md:p-12 rounded-[2rem] shadow-2xl border-8 border-yellow-400 max-w-lg w-full relative overflow-hidden">
                    <!-- 裝飾背景 -->
                    <div class="absolute top-0 left-0 w-full h-32 bg-blue-50 rounded-t-[1.5rem] -z-10"></div>
                    
                    <div class="flex justify-center mb-6">
                        <div class="relative">
                            <i data-lucide="award" class="w-24 h-24 ${badgeColor} drop-shadow-lg"></i>
                            <div class="absolute inset-0 flex items-center justify-center">
                                <span class="text-white font-black text-xl pt-2">${score * 100}</span>
                            </div>
                        </div>
                    </div>

                    <h3 class="text-xl font-bold text-gray-500 mb-1">南投縣政府環境保護局 認證</h3>
                    <h2 class="text-4xl font-black text-gray-800 mb-6">${title}</h2>
                    
                    <div class="bg-gray-50 p-6 rounded-2xl border-2 border-dashed border-gray-300 mb-8">
                        <p class="text-xl font-bold text-gray-700 leading-relaxed">
                            ${message}
                        </p>
                        <div class="mt-4 pt-4 border-t border-gray-200 flex justify-center gap-6">
                            <div class="text-center">
                                <div class="text-sm text-gray-500 font-bold mb-1">答對題數</div>
                                <div class="text-3xl font-black text-green-600">${score} / 9</div>
                            </div>
                        </div>
                    </div>

                    <button onclick="handleStart()" class="w-full bg-blue-600 text-white font-black text-xl py-4 rounded-xl shadow-[0_6px_0_rgb(29,78,216)] hover:shadow-[0_2px_0_rgb(29,78,216)] hover:translate-y-1 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i data-lucide="refresh-ccw" class="w-6 h-6"></i>
                        再玩一次
                    </button>
                </div>
            </div>
            `;
        }

        // 啟動應用
        render();

    </script>
</body>
</html>
