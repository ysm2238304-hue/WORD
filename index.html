<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="環保小尖兵">
    <meta name="theme-color" content="#EFF6FF">
    
    <title>環保小尖兵-平板九宮格闖關</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .hidden-view { display: none !important; }

        @media screen and (orientation: portrait) {
            .portrait-warning { display: flex; }
            #app-wrapper { display: none; }
        }
        @media screen and (orientation: landscape) {
            .portrait-warning { display: none; }
            #app-wrapper { display: flex; }
        }

        /* --- 核心魔法：鎖定 16:9 比例的容器 --- */
        .game-box {
            width: 100%;
            height: 100%;
            /* 透過視窗寬高交叉限制，強制鎖出完美的 16:9 畫布 */
            max-width: calc(100vh * 16 / 9);
            max-height: calc(100vw * 9 / 16);
            /* 開啟容器查詢，讓內部元素使用 cqw / cqh 進行完美等比縮放 */
            container-type: size;
            position: relative;
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
        @keyframes zoom-in { from { opacity: 0; transform: scale3d(0.8, 0.8, 1); } to { opacity: 1; transform: scale3d(1, 1, 1); } }
        @keyframes slide-up { from { opacity: 0; transform: translate3d(0, 4cqh, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
        @keyframes bounce-slow { 0%, 100% { transform: translate3d(0, -5%, 0); } 50% { transform: translate3d(0, 5%, 0); } }
        @keyframes float { 0%, 100% { transform: translate3d(0, 0, 0); } 50% { transform: translate3d(0, -2cqh, 0); } }
        
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; will-change: opacity; opacity: 0; }
        .animate-zoom-in { animation: zoom-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; will-change: transform, opacity; opacity: 0; }
        .animate-slide-up { animation: slide-up 0.4s ease-out forwards; will-change: transform, opacity; opacity: 0; }
        .animate-bounce-slow { animation: bounce-slow 3s ease-in-out infinite; will-change: transform; }
        .animate-float { animation: float 4s ease-in-out infinite; will-change: transform; }
        
        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            overflow: hidden; 
            overscroll-behavior: none; 
            touch-action: none; 
        }
        * { touch-action: none; }
        button, a, .grid-btn { 
            touch-action: manipulation; 
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        .grid-btn {
            box-shadow: 0 0.5cqh 1cqh 0 rgba(0,0,0,0.15);
            transition: all 0.1s;
            will-change: transform, box-shadow;
        }
        .grid-btn:active:not(.disabled) {
            transform: translate3d(0, 0.5cqh, 0) !important;
            box-shadow: 0 0 0 rgba(0,0,0,0.15) !important;
        }
        .grid-btn.disabled {
            box-shadow: inset 0 0.5cqh 1cqh rgba(0,0,0,0.1) !important;
            transform: translate3d(0, 0, 0) !important;
            cursor: not-allowed;
        }

        .z-word { display: inline-flex; align-items: center; margin: 0 1px 0.2cqh 1px; vertical-align: middle; }
        .z-base { line-height: 1; }
        .z-ruby { display: inline-flex; flex-direction: row; font-size: 0.45em; font-weight: 800; color: #4B5563; margin-left: 2px; }
        .z-symbols { display: flex; flex-direction: column; justify-content: center; }
        .z-sym { line-height: 1.05; text-align: center; }
        .z-sym.light-tone { margin-bottom: 2px; font-size: 1.2em; }
        .z-tone { display: flex; flex-direction: column; justify-content: center; margin-left: 1px; }
        .zhuyin-text { line-height: 1.8 !important; word-break: break-all; }
    </style>
</head>

                            <div id="play-monster-container"></div>
                        </div>
                        <div class="bg-white/90 px-[1.5cqw] py-[1.5cqh] rounded-[2cqh] border-[0.5cqh] border-gray-300 text-center shadow-md z-20 w-full flex-shrink-0">
                            <span class="text-[2cqh] font-bold text-gray-500 block mb-[0.5cqh]">遇到污染怪獸：</span>
                            <span id="play-monster-name" class="text-[3.5cqh] font-black text-red-600 drop-shadow-sm"></span>
                        </div>
                    </div>
                    <div class="flex-1 h-full flex flex-col justify-between py-0">
                        <div class="flex-shrink-0 bg-amber-100 text-amber-900 font-black p-[2cqh] rounded-[2cqh] border-l-[0.8cqh] border-amber-400 shadow-sm flex items-center gap-[1cqw]">
                            <i data-lucide="alert-circle" class="w-[4cqh] h-auto text-amber-600 flex-shrink-0"></i>
                            <span id="play-scenario" class="leading-relaxed zhuyin-text w-full text-[2.8cqh]"></span>
                        </div>
                        <div class="flex-1 min-h-0 bg-blue-50 p-[3cqh] rounded-[3cqh] border-[0.5cqh] border-blue-200 shadow-inner flex items-center justify-center text-center my-[2cqh]">
                            <h2 id="play-question" class="text-[3.8cqh] font-black text-gray-800 leading-snug drop-shadow-sm zhuyin-text w-full"></h2>
                        </div>
                        <div id="play-options" class="flex-shrink-0 flex flex-col gap-[1.5cqh]"></div>
                    </div>
                    
                    <div id="play-feedback" class="hidden-view absolute inset-0 z-50 flex items-center justify-center p-[4cqh] bg-gray-900/70 backdrop-blur-sm rounded-[4cqh] animate-fade-in"></div>
                </div>

                <!-- Result View -->
                <div id="view-result" class="hidden-view w-full h-full bg-white/95 backdrop-blur-xl rounded-[4cqh] shadow-2xl border-[1cqh] border-white p-[4cqh] flex flex-row gap-[4cqw] animate-zoom-in relative">
                    <div class="absolute top-[-20%] right-[-10%] w-[30cqh] h-[30cqh] bg-yellow-200/40 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute bottom-[-10%] left-[-10%] w-[25cqh] h-[25cqh] bg-blue-200/40 rounded-full blur-3xl pointer-events-none"></div>
                    
                    <div id="result-badge-container" class="flex-shrink-0 w-[40cqw] h-full rounded-[4cqh] p-[4cqh] flex flex-col items-center justify-evenly border-[1cqh] relative shadow-inner"></div>
                    
                    <div class="flex-1 h-full flex flex-col justify-between py-0">
                        <div class="flex items-center gap-[1.5cqw] bg-gray-50/80 px-[2cqw] py-[1.5cqh] rounded-full border-[0.4cqh] border-gray-200 shadow-sm w-max flex-shrink-0">
                            <img src="image_1c45dd.png" class="h-[6cqh] object-contain" />
                            <h3 class="text-[2.5cqh] font-black text-green-800 tracking-widest pt-1">南投縣政府環境保護局</h3>
                        </div>
                        <div class="flex-1 min-h-0 bg-blue-50 p-[4cqh] rounded-[4cqh] border-[0.6cqh] border-dashed border-blue-300 shadow-inner flex flex-col items-center justify-center my-[2cqh]">
                            <div class="flex items-center gap-[1cqw] mb-[2.5cqh] flex-shrink-0">
                                <i data-lucide="party-popper" class="w-[5cqh] h-auto text-orange-500 animate-bounce"></i>
                                <h3 class="text-[4cqh] font-black text-blue-800">闖關結果報告</h3>
                                <i data-lucide="party-popper" class="w-[5cqh] h-auto text-orange-500 animate-bounce transform -scale-x-100"></i>
                            </div>
                            <p id="result-message" class="text-[3cqh] font-bold text-gray-700 leading-snug text-center mb-[4cqh] flex-shrink-0"></p>
                            <div class="flex w-full justify-center gap-[3cqw] flex-shrink-0">
                                <div class="bg-white p-[3cqh] rounded-[2cqh] border-[0.6cqh] border-white shadow-md flex flex-col items-center min-w-[20cqw]">
                                    <div class="text-gray-500 font-bold mb-[1cqh] flex items-center gap-[0.5cqw] text-[2cqh]"><i data-lucide="target" class="w-[2.5cqh] h-auto text-orange-400"></i> 獲得分數</div>
                                    <div id="result-score-val" class="text-[6cqh] font-black text-orange-500"></div>
                                </div>
                                <div class="bg-white p-[3cqh] rounded-[2cqh] border-[0.6cqh] border-white shadow-md flex flex-col items-center min-w-[20cqw]">
                                    <div class="text-gray-500 font-bold mb-[1cqh] flex items-center gap-[0.5cqw] text-[2cqh]"><i data-lucide="swords" class="w-[2.5cqh] h-auto text-green-500"></i> 擊敗怪獸</div>
                                    <div id="result-kill-val" class="text-[6cqh] font-black text-green-600"></div>
                                </div>
                            </div>
                        </div>
                        <button onclick="handleStart()" class="flex-shrink-0 grid-btn w-full bg-gradient-to-b from-blue-500 to-blue-700 text-white font-black text-[3.5cqh] py-[2.5cqh] rounded-[3cqh] flex items-center justify-center gap-[1cqw] hover:from-blue-600 hover:to-blue-800">
                            <i data-lucide="refresh-ccw" class="w-[4cqh] h-auto"></i> 再玩一次
                        </button>
                    </div>
                </div>

                <!-- Confirm Modal -->
                <div id="modal-confirm" class="hidden-view fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-[4cqh]">
                    <div class="bg-white p-[5cqh] rounded-[3cqh] shadow-2xl border-[1cqh] border-red-300 w-[60cqw] max-w-[800px] text-center transform animate-zoom-in">
                        <div class="w-[12cqh] h-[12cqh] bg-red-100 rounded-full flex items-center justify-center border-[0.8cqh] border-red-400 mx-auto mb-[3cqh]">
                            <i data-lucide="alert-triangle" class="w-[6cqh] h-[6cqh] text-red-500 animate-pulse"></i>
                        </div>
                        <h3 class="text-[4cqh] font-black text-gray-800 mb-[2cqh]">確定要重新開始？</h3>
                        <p class="text-gray-600 font-bold text-[2.5cqh] mb-[4cqh] bg-gray-50 py-[2cqh] rounded-[2cqh] border-[0.4cqh] border-gray-200">目前的闖關紀錄將會全部消失喔！</p>
                        <div class="flex gap-[2cqw] justify-center">
                            <button onclick="confirmRestart(false)" class="grid-btn flex-1 bg-gray-200 text-gray-700 font-black text-[3cqh] py-[2.5cqh] rounded-[2cqh] border-[0.4cqh] border-gray-300 hover:bg-gray-300">取消</button>
                            <button onclick="confirmRestart(true)" class="grid-btn flex-1 bg-red-500 text-white font-black text-[3cqh] py-[2.5cqh] rounded-[2cqh] border-[0.4cqh] border-red-600 hover:bg-red-600">確定重置</button>
                        </div>
                    </div>
                </div>
            `;

            dom = {
                start: document.getElementById('view-start'),
                grid: document.getElementById('view-grid'),
                playing: document.getElementById('view-playing'),
                result: document.getElementById('view-result'),
                confirm: document.getElementById('modal-confirm'),
                gridScore: document.getElementById('grid-score'),
                gridContainer: document.getElementById('grid-container'),
                playQNum: document.getElementById('play-qnum'),
                playMonsterContainer: document.getElementById('play-monster-container'),
                playMonsterName: document.getElementById('play-monster-name'),
                playScenario: document.getElementById('play-scenario'),
                playQuestion: document.getElementById('play-question'),
                playOptions: document.getElementById('play-options'),
                playFeedback: document.getElementById('play-feedback'),
                resultBadge: document.getElementById('result-badge-container'),
                resultMessage: document.getElementById('result-message'),
                resultScoreVal: document.getElementById('result-score-val'),
                resultKillVal: document.getElementById('result-kill-val'),
            };

            dom.gridContainer.innerHTML = Array(9).fill(0).map((_, i) => `
                <button id="grid-btn-${i}" onclick="selectQuestion(${i})" class="grid-btn relative w-full h-full aspect-square rounded-[2cqh] flex items-center justify-center border-[0.6cqh] border-white/60 overflow-hidden group ${gridColors[i]}">
                    <div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                    <span class="text-[8cqh] font-black drop-shadow-lg">${i + 1}</span>
                </button>
            `).join('');
            
            lucide.createIcons();
        }

        function switchView(viewName) {
            dom.start.classList.add('hidden-view');
            dom.grid.classList.add('hidden-view');
            dom.playing.classList.add('hidden-view');
            dom.result.classList.add('hidden-view');

            if(viewName === 'start') {
                dom.start.classList.remove('hidden-view');
            } else if(viewName === 'grid') {
                dom.grid.classList.remove('hidden-view');
                updateGridState(); 
            } else if(viewName === 'playing') {
                dom.playing.classList.remove('hidden-view');
                updatePlayingState();
            } else if(viewName === 'result') {
                dom.result.classList.remove('hidden-view');
                updateResultState();
            }
        }

        function updateGridState() {
            dom.gridScore.textContent = score * 100;
            for(let i=0; i<9; i++) {
                let status = answeredStatus[i];
                let isDone = status !== null;
                let btn = document.getElementById(`grid-btn-${i}`);
                
                btn.className = `grid-btn relative w-full h-full aspect-square rounded-[2cqh] flex items-center justify-center border-[0.6cqh] border-white/60 overflow-hidden group ${isDone ? 'bg-gray-200 text-gray-400 disabled' : gridColors[i]}`;
                
                if (isDone) {
                    btn.onclick = null;
                    if (status === true) {
                        btn.innerHTML = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="check-circle" class="w-[45%] h-[45%] text-green-500 opacity-80 rotate-12"></i></div>`;
                    } else {
                        btn.innerHTML = `<div class="absolute inset-0 flex items-center justify-center"><i data-lucide="x-circle" class="w-[45%] h-[45%] text-red-400 opacity-80 -rotate-12"></i></div>`;
                    }
                } else {
                    btn.onclick = () => selectQuestion(i);
                    btn.innerHTML = `<div class="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity"></div><span class="text-[8cqh] font-black drop-shadow-lg">${i + 1}</span>`;
                }
            }
            lucide.createIcons();
        }

        function updatePlayingState() {
            const q = parsedQuestions[currentQ];
            dom.playQNum.textContent = currentQ + 1;
            dom.playMonsterName.textContent = q.villain;

            let villainClass = feedback ? (feedback.isCorrect ? 'scale-75 rotate-12 opacity-30 grayscale blur-md' : 'scale-110 -rotate-12 drop-shadow-2xl') : '';
            dom.playMonsterContainer.className = `w-full h-full flex items-center justify-center transition-all duration-700 ${villainClass} relative z-10`;
            dom.playMonsterContainer.innerHTML = q.villainIcon;
            
            dom.playScenario.innerHTML = q.pScenario;
            dom.playQuestion.innerHTML = q.pQuestion;

            dom.playOptions.innerHTML = q.pOptions.map((opt, idx) => {
                let btnStateClass = feedback === null 
                    ? 'bg-white border-gray-300 text-gray-700 hover:bg-blue-50 hover:border-blue-400 grid-btn cursor-pointer' 
                    : (idx === q.correctAnswer ? 'bg-green-100 border-green-500 text-green-800 shadow-inner' : 'bg-gray-100 border-gray-200 text-gray-400');
                return `
                <button ${feedback !== null ? 'disabled' : ''} onclick="handleAnswer(${idx})" class="w-full text-left p-[2cqh] rounded-[2cqh] font-black text-[3cqh] border-[0.6cqh] relative flex justify-between items-center ${btnStateClass}">
                    <span class="zhuyin-text flex-1 pr-2">${opt}</span>
                    ${feedback === null ? `<i data-lucide="mouse-pointer-click" class="w-[4cqh] h-auto opacity-30 flex-shrink-0 ml-1"></i>` : ''}
                </button>
                `;
            }).join('');

            if (feedback) {
                dom.playFeedback.classList.remove('hidden-view');
                dom.playFeedback.innerHTML = `
                    <div class="bg-white w-[80cqw] max-w-[1000px] h-[85cqh] rounded-[4cqh] p-[4cqh] shadow-2xl flex flex-col items-center justify-evenly text-center transform animate-zoom-in border-[1cqh] ${feedback.isCorrect ? 'border-green-400' : 'border-orange-400'}">
                        ${feedback.isCorrect ? `
                            <div class="w-[10cqh] h-[10cqh] bg-green-100 rounded-full flex flex-shrink-0 items-center justify-center border-[0.6cqh] border-green-400 animate-bounce">
                                <i data-lucide="check-circle" class="w-[50%] h-[50%] text-green-500"></i>
                            </div>
                            <h3 class="text-[5cqh] font-black text-green-600 flex-shrink-0">攻擊成功！</h3>
                        ` : `
                            <div class="w-[10cqh] h-[10cqh] bg-red-100 rounded-full flex flex-shrink-0 items-center justify-center border-[0.6cqh] border-red-400">
                                <i data-lucide="x-circle" class="w-[50%] h-[50%] text-red-500"></i>
                            </div>
                            <h3 class="text-[5cqh] font-black text-red-600 flex-shrink-0">哎呀！打歪了</h3>
                        `}
                        <div class="w-full bg-gray-50 p-[3cqh] rounded-[2cqh] border-[0.4cqh] border-gray-200 text-left flex-shrink-0">
                            <p class="text-gray-700 font-bold text-[3cqh] leading-relaxed zhuyin-text">${q.pExplanation}</p>
                        </div>
                        <button onclick="handleNext()" class="grid-btn w-full py-[2cqh] rounded-full font-black text-[3.5cqh] text-white shadow-lg flex items-center justify-center gap-[1cqw] ${feedback.isCorrect ? 'bg-green-500' : 'bg-orange-500'} cursor-pointer flex-shrink-0">
                            返回九宮格 <i data-lucide="arrow-right-circle" class="w-[4cqh] h-auto"></i>
                        </button>
                    </div>
                `;
            } else {
                dom.playFeedback.classList.add('hidden-view');
            }
            lucide.createIcons();
        }

        function updateResultState() {
            let title = score === 9 ? "完美通關神射手！" : (score >= 6 ? "優秀環保尖兵！" : "再接再厲小尖兵！");
            let message = score === 9 ? "太厲害了！你消滅了所有的污染怪獸，成功守護了敦和國小！" : 
                         (score >= 6 ? "表現不錯喔！擊退了大部分的怪獸，繼續保持環保好習慣！" : "怪獸還在搗蛋！重新拿好沙包，再挑戰一次吧！");
            
            let badgeColor = score === 9 ? "text-yellow-500" : (score >= 6 ? "text-blue-500" : "text-gray-400");
            let badgeBg = score === 9 ? "bg-gradient-to-b from-yellow-50 to-orange-100 border-yellow-300" : 
                         (score >= 6 ? "bg-gradient-to-b from-blue-50 to-cyan-100 border-blue-300" : "bg-gradient-to-b from-gray-50 to-gray-200 border-gray-300");
            
            let starCount = score === 9 ? 3 : (score >= 6 ? 2 : 1);
            let starsHtml = '<div class="flex justify-center items-end gap-[1cqw] mb-[2cqh]">';
            for(let i=0; i<3; i++) {
                let sizeClass = (i === 1) ? 'w-[10cqh] h-auto mb-[2cqh]' : 'w-[7cqh] h-auto';
                let colorClass = i < starCount ? 'text-yellow-400' : 'text-gray-300 opacity-50';
                let fillStyle = i < starCount ? 'fill: currentColor' : 'fill: none';
                starsHtml += `<i data-lucide="star" class="${sizeClass} ${colorClass} drop-shadow-md animate-bounce-slow" style="animation-delay: ${i*0.2}s; ${fillStyle}"></i>`;
            }
            starsHtml += '</div>';

            dom.resultBadge.className = `flex-shrink-0 w-[40cqw] h-full rounded-[4cqh] p-[4cqh] flex flex-col items-center justify-evenly border-[1cqh] relative shadow-inner ${badgeBg}`;
            dom.resultBadge.innerHTML = `
                <i data-lucide="sparkles" class="absolute top-[10%] left-[10%] w-[5cqh] h-auto text-yellow-400 animate-pulse opacity-80"></i>
                <i data-lucide="sparkles" class="absolute bottom-[15%] right-[10%] w-[6cqh] h-auto text-yellow-500 animate-pulse opacity-80"></i>
                ${starsHtml}
                <div class="relative animate-float my-[1cqh]">
                    <i data-lucide="award" class="w-[30cqh] h-auto ${badgeColor} drop-shadow-[0_1.5cqh_2cqh_rgba(0,0,0,0.15)]" style="fill: currentColor; opacity: 0.2"></i>
                    <i data-lucide="award" class="absolute inset-0 w-[30cqh] h-auto ${badgeColor}"></i>
                    <div class="absolute inset-0 flex items-center justify-center flex-col pt-[15%]">
                        <span class="text-white font-black text-[6cqh] drop-shadow-md">${score * 100}</span>
                    </div>
                </div>
                <div class="bg-white/90 px-[2cqw] py-[1.5cqh] rounded-[3cqh] border-[0.6cqh] border-white shadow-lg z-10 w-[95%] text-center relative mt-[2cqh]">
                    <div class="absolute -top-[2cqh] left-1/2 transform -translate-x-1/2 bg-gray-700 text-white text-[2cqh] font-bold px-[2cqw] py-[0.5cqh] rounded-full whitespace-nowrap">最終稱號</div>
                    <h2 class="text-[4cqh] font-black text-gray-800 drop-shadow-sm tracking-wide mt-[1cqh]">${title}</h2>
                </div>
            `;

            dom.resultScoreVal.textContent = score * 100;
            dom.resultMessage.textContent = message;
            dom.resultKillVal.innerHTML = `${score}<span class="text-[4cqh] text-gray-300 ml-1">/9</span>`;
            
            lucide.createIcons();
        }

        window.handleStart = function() { 
            gameState = 'grid'; answeredStatus = new Array(9).fill(null); score = 0; switchView('grid'); 
        }
        window.promptRestart = function() { 
            dom.confirm.classList.remove('hidden-view'); 
        }
        window.confirmRestart = function(yes) {
            dom.confirm.classList.add('hidden-view');
            if(yes) { gameState = 'start'; answeredStatus = new Array(9).fill(null); score = 0; currentQ = 0; feedback = null; switchView('start'); }
        }
        window.selectQuestion = function(idx) {
            if (answeredStatus[idx] !== null) return; 
            currentQ = idx; gameState = 'playing'; feedback = null; switchView('playing');
        }
        window.handleAnswer = function(idx) {
            if (feedback !== null) return; 
            const isCorrect = idx === parsedQuestions[currentQ].correctAnswer;
            if (isCorrect) score += 1;
            answeredStatus[currentQ] = isCorrect;
            feedback = { isCorrect: isCorrect, text: parsedQuestions[currentQ].pExplanation };
            updatePlayingState(); 
        }
        window.handleNext = function() {
            let completedCount = answeredStatus.filter(s => s !== null).length;
            if (completedCount === 9) switchView('result'); else switchView('grid');
        }

        window.addEventListener('load', () => {
            parsedQuestions = questions.map(q => ({
                ...q,
                pScenario: parseZhuyin(q.scenario),
                pQuestion: parseZhuyin(q.question),
                pOptions: q.options.map(opt => parseZhuyin(opt)),
                pExplanation: parseZhuyin(q.explanation)
            }));

            initViews();
            switchView('start');

            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                if(loader) {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.remove(), 500);
                }
            }, 300);
        });
    </script>
</body>
</html>
